name: Stündlich — Sendezeiten

# **Dieser Lauf sammelt und reicht ein — er baut nicht und schreibt nicht auf `main`.** Der Fund geht als Pull Request auf einen eigenen Zweig (`tools/quellen-pr.sh`)
# und wird gemergt, wenn GitHub `MERGEABLE` sagt; sonst übernimmt „Claude — Daten-PR zusammenführen". Den Datensatz baut „Bestand — zusammenführen und bauen"; dass
# eine Quelle schweigt, meldet dort `data:check` (Daniel, 30.08.2026: „wöchentlich und stündlich sollte nie rot sein können, alles was sie machen ist sammeln und liefern").
#
# Das Crunchyroll-Wochenprogramm und der Katalogfund neuer deutscher Folgen (seit 27.10.2026) ändern sich mehrmals täglich: Uhrzeiten verschieben sich, Folgen kommen dazu, Staffeln fallen aus.
# Alles andere ändert sich höchstens täglich und läuft im Tageslauf. Gepusht wird nur bei echter Änderung.
#
# Umbau vom 05.10.2026: eigene Gruppe `stunde` (vorher `daten`: ein Wochenlauf hielt den Stundenlauf bis zu anderthalb Stunden an), Schritte über `tools/schritt.sh`
# (Zeitgrenze, sichtbares Scheitern, gelbe Meldung), Einrichtung als eigene Aktion, AniList-Cache nur gelesen (ein Lauf, der ihn unverändert wieder ablegt, verdrängte
# am 29.09.2026 den frischen Stand).

on:
  # Zeitplan: Cloudflare-Wecker (`worker/src/wecker.ts`) startet diesen Lauf per workflow_dispatch zur vollen Stunde (UTC). GitHubs eigener Cron kam
  # gemessen alle ~4,6 Stunden und würde Läufe verdoppeln; `wecker-wache.yml` holt Überfälliges nach, falls der Wecker ausfällt (05.10.2026).
  workflow_dispatch:
    inputs:
      tvde:
        description: 'tv.de heute noch einmal holen (sonst einmal am Tag), samt Nachtblöcken'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stunde
  cancel-in-progress: false

jobs:
  sendezeiten:
    runs-on: ubuntu-latest
    # Gemessen zwei Minuten (Median); 25 sind ein Vielfaches. Läuft es darüber hinaus, ist der nächste Lauf der bessere Weg — die Abrufe sind idempotent.
    timeout-minutes: 25
    # Zweck und Ziel gehen an die Statusanzeige mit (Daniel, 21.08.2026: „Zweck sollte kurz beschreiben wofür dieser lauf ist").
    env:
      LAUF_ZWECK: 'Hält die Sendetermine von anime-kalender.de stündlich aktuell'
      LAUF_ZIEL: 'Crunchyroll-Wochenprogramm, neue deutsche Folgen und TV-Programm einlesen'
      LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
      JOB_ANZEIGE: Sendezeiten
    steps:
      # Sofort anmelden, noch vor Checkout und Einrichtung (30–60 Sekunden, in denen die Statusanzeige sonst nichts weiß; Daniel, 21.08.2026).
      - name: Sofort anmelden
        continue-on-error: true
        run: |
          if [ -z "$LAUF_TOKEN" ]; then exit 0; fi
          printf '{"lauf_id":"%s","repo":"%s","workflow":"%s","zweck":"%s","ziel":"%s","zustand":"laeuft","url":"%s","notiz":"wird eingerichtet"}' \
            "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" "$LAUF_ZWECK" "$LAUF_ZIEL" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/anmeldung.json
          curl -sS --max-time 10 -X POST "https://newsletter.animekalender.workers.dev/lauf" \
            -H "Content-Type: application/json" -H "X-Lauf-Token: $LAUF_TOKEN" \
            --data-binary @/tmp/anmeldung.json > /dev/null || true

      # Ohne `ref` holte checkout den Commit des Auslösers — bei einem eingereihten Lauf den Stand von vor der Wartezeit (so am 09.08.2026).
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Einrichten
        id: einrichten
        uses: ./.github/actions/einrichten
        with:
          cache: restore
          playwright: 'true'

      # `data/cache/` wird vom Build gebraucht — ohne ihn entstünde ein Datensatz ganz ohne Titel. Fehlt er, holt dieser Schritt die Rohdaten.
      - name: Rohdaten holen, falls kein Cache da ist
        if: steps.einrichten.outputs.cache-treffer == ''
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: bash tools/schritt.sh --zeit 15m "Rohdaten holen" -- npm run data:fetch

      # Das Wochenprogramm ist seit 27.10.2026 die einzige Quelle der Sendetermine: Der Simulcast-Kalender ist auf /de/simulcasts umgeleitet (seit ~21.10.2026).
      # Es legt auch neue Serien im Kalenderbestand an; Abweichungen gehen als Vorfall an den Worker, daher das Token.
      - name: Crunchyroll-Wochenprogramm lesen
        run: bash tools/schritt.sh --zeit 8m "Crunchyroll-Wochenprogramm" -- npx tsx pipeline/scrape-crunchyroll-woche.ts

      # Neue deutsche Folgen stündlich statt erst im Tageslauf (Psyren Folge 1: verfügbar 26.10.2026 14:30 UTC, im Bestand erst 27.10. 04:37; Daniel: „spätestens wenn unser
      # crunchy lauf es bestätigt muss es im kalender auftauchen“). Drei Schritte wie im Tageslauf (`refresh-data.yml`), vor „Verpasste Termine prüfen“, das den Katalogfund liest.
      # Gemessen am Tageslauf 27.10.2026: 4 s / 2 s / 4 s. Der Bestandsbau läuft nach diesem Lauf (`workflow_run`), die Folge steht also spätestens nach Lauf + Bau im Kalender.
      - name: Neue deutsche Folgen bei Crunchyroll finden
        run: bash tools/schritt.sh --zeit 3m "Neue Folgen bei Crunchyroll" -- npm run data:cr-neu

      - name: Crunchyroll-Zugangspaket über die Weiche holen
        env:
          CR_WEICHE_TOKEN: ${{ secrets.CR_WEICHE_TOKEN }}
        run: bash tools/schritt.sh --zeit 2m "Zugangspaket holen" -- node tools/cr-zugang-holen.mjs --github-env

      # Ohne frisches Paket bricht der Schritt ab (kein Rückfall auf das 24-Stunden-Geheimnis CR_ZUGANG, das bleibt dem Tageslauf); `--nur-neu` liest nur Serien mit neuer Folge, die Fristen gelten weiter.
      - name: Die neu gefundenen Serien sofort beurteilen
        env:
          CR_ZUGANG: ${{ env.CR_ZUGANG_FRISCH }}
        # Kein eigener `fehler`-Melder: ein Weichen-Ausfall wäre sonst bis zu 24 rote Statuseinträge am Tag; `lauf-abmelden.sh` meldet den Lauf gelb mit dem Schrittnamen.
        run: bash tools/schritt.sh --zeit 8m "Neue Serien beurteilen" -- npm run data:cr-dub -- --nur-neu --limit 60

      # Ein geschätzter Termin, an dem nichts erschien, darf nicht stehen bleiben, als wäre er eingetreten. Braucht die Beobachtungen des Kalender-Abrufs.
      - name: Verpasste Termine prüfen
        run: bash tools/schritt.sh --zeit 5m "Verpasste Termine" -- npx tsx pipeline/termine-pruefen.ts

      # Neue Anime2You-Meldungen stündlich statt erst im Tageslauf (Artikel warteten im Mittel 16 h): nur die erste Seite je Feed (4 Abrufe), Volltext nur für neue Adressen.
      - name: Anime2You (leicht)
        run: bash tools/schritt.sh --zeit 5m "Anime2You (leicht)" -- npm run data:anime2you -- --leicht

      # Was der Prüflauf gemessen hat, als Bild festhalten (privat, R2). Öffnet nur dann einen Browser, wenn ein frischer Vermerk noch kein Bild hat.
      - name: Messbelege ablegen
        run: bash tools/schritt.sh --zeit 10m "Messbelege" -- npx tsx pipeline/messbelege.ts

      # Das TV-Programm von RTL+ nennt nur den laufenden Tag — mehrmals täglich abgefragt, damit keine Sendung durchrutscht (16.09.2026).
      - name: TV-Programm von RTL+ lesen
        run: bash tools/schritt.sh --zeit 5m "TV-Programm" -- npm run data:tv-programm -- ${{ inputs.tvde && '--tvde' || '' }}

      - name: Quellen als Pull Request einreichen
        if: always()
        uses: ./.github/actions/einreichen
        with:
          nachricht: 'chore(data): Sendezeiten gesammelt'
          fund: sendezeiten
          app-id: ${{ secrets.DATEN_APP_ID }}
          app-key: ${{ secrets.DATEN_APP_KEY }}

      - name: Fehlschläge auswerten
        id: auswerten
        if: always()
        run: bash tools/schritte-auswerten.sh

      # Läuft auch nach einem Fehler: Der rote Lauf ist der, den man sehen will.
      - name: Lauf abmelden
        continue-on-error: true
        if: always()
        run: bash tools/lauf-abmelden.sh "${{ job.status }}" "${{ steps.auswerten.outputs.fehler }}"
