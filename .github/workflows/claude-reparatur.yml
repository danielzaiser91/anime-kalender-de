name: Claude — roten Datenlauf untersuchen

# Springt an, wenn ein Datenlauf rot geworden ist, liest sein Protokoll, sucht
# die Ursache und öffnet einen Pull Request mit der Reparatur.
#
# Warum als **eigener** Workflow und nicht als letzter Schritt im Datenlauf:
# Der Datenlauf bricht bei einem Fehler ab, und ein Schritt dahinter liefe dann
# nur mit `if: always()` — mitten in einem Job, dessen Arbeitsverzeichnis schon
# in einem halben Zustand ist. Über `workflow_run` startet die Untersuchung mit
# einem sauberen Auscheckvorgang, kennt aber die Nummer des gescheiterten Laufs.
#
# Anmeldung über `CLAUDE_CODE_OAUTH_TOKEN`, nicht über einen API-Schlüssel:
# Dieses Token hängt an Daniels Abo, ein Lauf hier erzeugt also keine getrennte
# API-Rechnung. Erzeugt wird es lokal mit `claude setup-token`.

on:
  workflow_run:
    workflows:
      # Seit dem 30.08.2026 sammeln die drei planmäßigen Läufe nur noch. Rot
      # werden kann allein der Bau-Lauf — dort steht auch alles, was er
      # reparieren könnte.
      - 'Bestand — zusammenführen und bauen'
      # **Die Wache findet, dieser Lauf wertet aus.**
      #
      # Am 03.09.2026 meldete die Wache „5 Urteile verloren", und ausgewertet
      # wurde es erst, als Daniel danach fragte. Sein Einwand: „genau für solche
      # findings sollte doch der diagnose task da sein, damit wir sehen ob unsere
      # automatismen wirklich korrekt funktionieren … das ergebnis auswertest und
      # entsprechend handelst."
      #
      # Ein Befund, den niemand liest, ist keine Wache, sondern ein Protokoll.
      - 'Wache — Delta und Briefkasten'
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

# Ein roter Lauf genügt. Läuft schon eine Untersuchung, wartet die nächste —
# zwei Claudes am selben Repo erzeugen zwei widersprüchliche Pull Requests.
concurrency:
  group: claude-reparatur
  cancel-in-progress: false

jobs:
  untersuchen:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    # Zweck und Ziel gehen an die Statusanzeige mit. Ohne sie steht dort nur
    # der Workflow-Name, und der sagt bei drei Auftrags-Läufen dreimal
    # dasselbe (Daniel, 21.08.2026: „Zweck sollte kurz beschreiben wofür
    # dieser lauf ist"). Der Lauf weiß es, die Anzeige nicht — also liefert
    # er es mit.
    env:
      LAUF_ZWECK: "Untersucht einen rot gelaufenen Datenlauf von anime-kalender.de"
      LAUF_ZIEL: "Ursache benennen und, wenn möglich, als Pull Request beheben"
    steps:
      # Sofort anmelden, noch vor allem anderen.
      #
      # Der Schritt weiter unten braucht das ausgecheckte Skript und läuft
      # deshalb erst nach Checkout und npm-Einrichtung — das sind dreißig bis
      # sechzig Sekunden, in denen die Statusanzeige nichts weiß. Daniel am
      # 21.08.2026: „der läuft sogar schon seit 1min aber ist erst jetzt in
      # der app aufgetaucht."
      #
      # Ein curl braucht nichts als das Token. Schlägt er fehl, läuft der Job
      # weiter — die spätere Anmeldung holt es nach.
      - name: Sofort anmelden
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: |
          if [ -z "$LAUF_TOKEN" ]; then exit 0; fi
          printf '{"lauf_id":"%s","repo":"%s","workflow":"%s","zustand":"laeuft","url":"%s","notiz":"wird eingerichtet"}' \
            "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/anmeldung.json
          curl -sS --max-time 10 -X POST "https://newsletter.animekalender.workers.dev/lauf" \
            -H "Content-Type: application/json" -H "X-Lauf-Token: $LAUF_TOKEN" \
            --data-binary @/tmp/anmeldung.json > /dev/null || true


      - uses: actions/checkout@v4
        with:
          ref: main
          # Die Vorgeschichte wird gebraucht: Fast jede Ursache lässt sich
          # daran ablesen, was sich seit dem letzten grünen Lauf geändert hat.
          fetch-depth: 50

      # Meldet der Statusanzeige, dass hier etwas läuft. Ohne LAUF_TOKEN
      # passiert nichts — eine fehlende Meldung darf keinen Lauf rot machen.
      # Das Meldeskript an einen Ort legen, den kein Zweigwechsel wegnimmt.
      #
      # Am 21.08.2026 hat ein Auftrags-Lauf seinen eigenen Zweig angelegt und
      # ist dorthin gewechselt — auf dem gab es `tools/lauf-melden.sh` noch
      # nicht. Die Abmeldung scheiterte mit Exit 127 und machte einen Lauf rot,
      # dessen Arbeit fertig und richtig war.
      - name: Melder bereitlegen
        run: |
          cp tools/lauf-melden.sh "$RUNNER_TEMP/lauf-melden.sh"
          echo "MELDER=$RUNNER_TEMP/lauf-melden.sh" >> "$GITHUB_ENV"

      - name: Lauf anmelden
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" laeuft

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Ohne diese Zeile passiert nichts: Die Action lehnt Bots als Auslöser
          # ab, damit sie sich nicht selbst in eine Schleife ruft — und unsere
          # Datenläufe committen als `github-actions[bot]`.
          allowed_bots: 'github-actions[bot]'
          claude_args: |
            # Sechzig statt dreißig: Am 29.08.2026 endete ein Lauf mit
            # „Reached maximum number of turns (30)" und hat **nichts**
            # hinterlassen — weder Befund noch Issue. Allein die Prüfkette
            # kostet neun Aufrufe, und `npm run build` dauert.
            --max-turns 60
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob"
          prompt: |
            Der Lauf „${{ github.event.workflow_run.name }}" ist fehlgeschlagen.
            Lauf-Nummer: ${{ github.event.workflow_run.id }}
            Protokoll: gh run view ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --log-failed

            **Zwei Arten von Läufen kommen hier an, und sie verlangen
            Verschiedenes.**

            Ist es die **Wache**, ist am Bau nichts kaputt — sie meldet, dass der
            **Bestand** etwas verloren hat. Ihr Befund steht im Klartext in
            `daniel-zum-abarbeiten/00-wache.md`; lies ihn zuerst und miss dann,
            welcher Lauf und welche Quelle den Verlust gebracht haben. Der
            Vergleich läuft rein auf Git-Ständen:

                git log --oneline --since="3 days ago" -- data/
                git show <commit>:public/data/titles.json > /tmp/vorher.json

            Am 03.09.2026 war die Antwort ein Abruf, der seine eigene Datei
            komplett neu schrieb und dabei 15 Belege verlor, die er beim
            aktuellen Durchgang nicht mehr als Kandidaten hatte — nachzulesen in
            `daniel-zum-abarbeiten/14-crunchyroll-filme-synchro-verloren.md`.
            **Ein Verlust im Bestand ist fast nie ein Fehler im Bau, sondern
            einer in der Quelle oder in ihrem Abruf.**

            Bei jedem anderen Lauf gilt das Übliche: das Protokoll lesen.

            Deine Aufgabe, in dieser Reihenfolge:

            0a. **Bei einem Wache-Befund: schreibe deine Auswertung als Datei**
                nach `daniel-zum-abarbeiten/00-wache-auswertung.md` und committe
                sie auf `main`. Nicht nur ein Issue — die Datei ist der Ort, an
                dem am nächsten Tag jemand nachliest.

                Sie beantwortet vier Fragen, in dieser Reihenfolge, und jede in
                zwei bis vier Sätzen:

                - **Was läuft korrekt?** Welche Automatik hat getan, was sie
                  soll — gemessen, nicht vermutet.
                - **Wo ist Verbesserungspotenzial?** Etwas funktioniert, könnte
                  aber genauer, billiger oder früher greifen.
                - **Wo sind echte Risiken und Lücken?** Was würde einen
                  ähnlichen Verlust nicht bemerken?
                - **Was läuft komplett falsch?** Mit der Zeile, an der es bricht.

                Steht dort schon eine Auswertung, hänge deine oben an und lass
                die alten stehen — sie sind der Verlauf, an dem sich zeigt, ob
                eine Lücke wiederkehrt.

            0b. **Und trage eine Aufgabe in `status.md` ein**, im Abschnitt
                „In Arbeit", mit Story Points und einer Notiz, die den Befund in
                zwei Sätzen nennt. Das ist kein Zierrat: Der Footer jeder Antwort
                zählt aus `status.md`, also taucht dein Eintrag beim nächsten
                Start des Clients von selbst auf — ohne dass jemand daran denken
                muss.

                Daniel am 03.09.2026: „also sollte entsprechend ein todo angelegt
                werden vom cloud claude, etwas, was du automatisch im blick hast
                und mitbekommst, auch wenn ich nicht explizit darauf hinweise bei
                der nächsten session an meinem pc."

                Hast du die Ursache im selben Lauf behoben, trägst du sie
                trotzdem ein — als erledigt, mit dem, was zu prüfen bleibt. Eine
                Reparatur, die niemand gegenprüft, ist eine Behauptung.

            0. **Zuerst den Befund festhalten, dann reparieren.** Sobald du die
               Ursache kennst, öffne ein Issue mit ihr — auch wenn du gleich
               danach einen Pull Request machst. Grund: Am 29.08.2026 endete ein
               Lauf an der Zuggrenze und hinterließ nichts; die Diagnose war
               gemacht und ging verloren. Ein Issue kostet einen Zug und
               überlebt jeden Abbruch.

            1. Lies das Protokoll des fehlgeschlagenen Schritts und benenne die
               Ursache. Rate nicht — zitiere die Zeile, an der es bricht.
            2. Entscheide, ob es ein Fehler im Code ist oder eine fremde Quelle,
               die sich geändert hat oder ausgefallen ist. Bei einem Ausfall einer
               fremden Quelle ist **nichts zu reparieren**: Dann öffnest du keinen
               Pull Request, sondern schreibst deinen Befund in ein Issue.
            3. Ist es ein Fehler im Code, repariere ihn so knapp wie möglich und
               öffne einen Pull Request.

            Verbindlich dabei:

            - `CLAUDE.md` im Wurzelverzeichnis gilt. Dort stehen die Grundsätze
              dieses Projekts, besonders: Nichts behaupten, was nicht belegt ist.
            - Die Prüfkette muss vor dem Pull Request grün sein:
              `npm run data:validate && npm run check:logic && npm run check:cr-zuordnung && npm run typecheck && npm run check:worker && npm run check:hooks && npm run check:extension && npm run check:zugangsart && npm run build`
            - Ist der Fehler ein Widerspruch im Datensatz (`pruefeErgebnis` bricht
              ab), dann ist der Melder **nicht** das Problem. Ihn weicher zu
              stellen, um einen grünen Lauf zu bekommen, ist ausdrücklich falsch —
              repariere die Ursache und lass die Zusicherung stehen.
            - Kommentare, Commit-Nachricht und Pull-Request-Text auf Deutsch.
            - **Die Prüfkette läuft einmal, am Ende.** Sie kostet neun Aufrufe;
              wer sie zwischendurch startet, verbraucht seine Züge daran und
              kommt nicht mehr zum Pull Request.

      # Läuft auch nach einem Fehler: Der rote Lauf ist der, den man sehen will.
      - name: Lauf abmelden
        continue-on-error: true
        if: always()
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" "${{ job.status == 'success' && 'ok' || job.status == 'cancelled' && 'abgebrochen' || 'fehler' }}"
