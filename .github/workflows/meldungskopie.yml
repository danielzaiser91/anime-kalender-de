name: Meldungskopie — SQLite-Kopie der Meldungsdaten

# **Täglich eine SQLite-Kopie der Meldungsdaten (`pruefung`, `prime_folge`, `titel_zeile`)**, damit Auswertungen und Einmal-SQL nie an der echten D1
# laufen (Abschnitt „Auswertungen an der Kopie“ in `docs/wissen/betrieb.md`). Am 14.10.2026 kamen 11,7 von 12,5 Mio. gelesenen Zeilen von Einmal-SQL und
# zwei Auswertungen; dieselbe Einspiel-SQL läuft an einer Datei in 324 ms. Dieser Lauf liest die drei Tabellen einmal (rund 73.000 Zeilen, 1,5 % des
# Tageskontingents) und legt die Datei als Artefakt ab; Agenten holen sie mit `npm run meldungskopie -- holen`.
#
# Zeitplan: Cloudflare-Wecker (`shared/weckplan.ts`) täglich um 03 UTC per workflow_dispatch, `wecker-wache.yml` holt Überfälliges nach. Ein laufender
# Export blockiert andere Abfragen an der D1 (Cloudflare-Doku „Import and export data“, abgerufen 14.10.2026) — um 03 UTC ist die Last am kleinsten.
#
# Das Cloudflare-Token (`CLOUDFLARE_API_TOKEN`, Token „anime-kalender-deploy“ mit D1-Schreibrecht, weil `d1 export` es verlangt; der Lauf schickt nur Lesebefehle) fehlt nicht still: ohne Token wird der Lauf rot, sonst fände `holen` einen grünen Lauf ohne Datei.
# Die Kopie enthält nur die drei Meldungstabellen; `tools/meldungskopie-bauen.mjs` verweigert jede andere Tabelle (Newsletter-Adressen, Zugänge).
# **Das Artefakt ist verschlüsselt:** Das Repo ist öffentlich, ein angemeldetes GitHub-Konto kann Artefakte laden, und der Worker gibt diese Daten nur mit `LAUF_TOKEN` heraus
# (`prime_folge.roh` enthält ungefilterte Player-Felder). Der Schlüssel wird aus `LAUF_TOKEN` abgeleitet (AES-256-GCM, `tools/meldungskopie-schluessel.mjs`); fehlt er, bricht `ziehen` vor dem ersten D1-Zugriff ab.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meldungskopie
  cancel-in-progress: false

jobs:
  kopie:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten
        run: npm ci

      - name: Kopie ziehen und bauen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 567f5e28368c5bbcfeffad3e674b02ab
        run: node tools/meldungskopie.mjs ziehen --ziel meldungen.sqlite.enc

      # Ein roter Lauf steht sonst nur in GitHub; die Laufstatus-App (und damit `laeufe-aufraeumen`) sah den vom 15.10.2026 nie.
      - name: Fehlschlag melden
        if: failure()
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          LAUF_ZWECK: "Zieht täglich die Kopie der Meldungsdaten für Auswertungen"
          LAUF_ZIEL: "Artefakt meldungskopie liegt bereit"
        run: bash tools/lauf-melden.sh fehler "Meldungskopie nicht gebaut"

      - uses: actions/upload-artifact@v4
        with:
          name: meldungskopie
          path: meldungen.sqlite.enc
          retention-days: 3
          overwrite: true
