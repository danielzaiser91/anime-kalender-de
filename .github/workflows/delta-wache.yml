name: Wache — Delta und Briefkasten

# **Diese Wache lief bis zum 03.09.2026 auf Daniels Rechner.**
#
# Sie war eine geplante Aufgabe im Claude-Client: jeden Morgen um 09:07 die
# Delta-Historie durchsehen und melden, was auffällt. Sein Einwand: „diese
# routine kann doch problemlos remote laufen? … änder das, sodass es nicht mehr
# auf meinem pc läuft."
#
# Er hat recht, und mehr als das: Sie **braucht** kein Modell. Die Beurteilung
# steckt längst in `tools/delta-pruefen.mjs` — es endet mit Exit-Code 1, wenn
# ein Lauf etwas Auffälliges getan hat. Was ein Modell hier tat, war vorlesen.
# Als Workflow ist die Wache billiger, überlebt jedes Herunterfahren und hält
# ihr Ergebnis dort fest, wo es auch morgen noch steht.
#
# **Das Ergebnis landet im Repo, nicht in einem Chat** (Daniel, 03.09.2026: „im
# chat soll nix stehen, das ergebnis soll als file ins repo"). Eine Meldung im
# Gespräch ist beim nächsten Start weg; `daniel-zum-abarbeiten/00-wache.md` steht
# auch in drei Monaten noch da, mit Datum und Vorgeschichte.
#
# **Warum es diese Wache überhaupt gibt:** Am 26.08.2026 gingen an einem Abend
# zweimal Meldungen aus der Browser-Erweiterung verloren, ohne dass ein Lauf rot
# wurde — 508 Disney-Meldungen wurden zu einem einzigen Eintrag abgehakt, 216
# One-Piece-Meldungen verschwanden ganz. Gefunden hat es Daniel, weil ihm eine
# Zahl komisch vorkam. Das soll ihm keiner mehr abverlangen.

on:
  schedule:
    # 07:20 UTC ist 09:20 in Berlin — kurz nach dem täglichen Datenlauf um
    # 06:17, damit die Wache den frischen Stand sieht und nicht den von gestern.
    - cron: '20 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: delta-wache
  cancel-in-progress: false

jobs:
  wache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Der Datenlauf hat gerade gepusht — diese Wache braucht dessen Stand.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci` wäre hier Verschwendung: Beide Skripte kommen mit dem aus, was
      # Node selbst mitbringt — kein Import aus `node_modules`.

      # `continue-on-error`, damit die zweite Prüfung auch nach einem Befund
      # läuft: Zwei Auffälligkeiten am selben Morgen sind wahrscheinlicher als
      # eine, und die zweite ginge sonst verloren. Über Rot entscheidet der
      # Schritt am Ende.
      - name: Delta der letzten 24 Stunden
        id: delta
        continue-on-error: true
        run: node tools/delta-pruefen.mjs --tage 1 | tee delta.txt

      - name: Briefkasten — kommt Daniels Arbeit an?
        id: kasten
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: node tools/briefkasten-wache.mjs | tee briefkasten.txt

      # **Der Exit-Code kommt aus `steps.*.outcome`, nicht aus der Pipe.**
      #
      # `node … | tee` gibt den Rückgabewert von `tee` zurück, und der gelingt
      # immer — derselbe Fehler wie `git push | tail` am 29.08.2026, der drei
      # Commits eine halbe Stunde lang verschluckt hat. GitHub merkt sich das
      # Ergebnis des Schritts trotzdem; das ist die verlässliche Quelle.
      - name: Ergebnis in die Wache-Datei schreiben
        run: |
          LAGE=ok
          if [ "${{ steps.delta.outcome }}" != "success" ] || [ "${{ steps.kasten.outcome }}" != "success" ]; then
            LAGE=befund
          fi
          node tools/wache-schreiben.mjs delta.txt briefkasten.txt "$LAGE"
          rm -f delta.txt briefkasten.txt

      - name: Änderung committen
        run: |
          git config user.name "anime-kalender-bot"
          git config user.email "bot@anime-kalender.de"
          git add daniel-zum-abarbeiten/00-wache.md
          if git diff --staged --quiet; then
            echo "Keine Änderung an der Wache-Datei."
            exit 0
          fi
          git commit -q -m "chore(wache): Bestand und Briefkasten geprüft"
          # Der tägliche Datenlauf kann zwischendurch gepusht haben.
          git pull -q --rebase origin main || true
          git push -q; echo "push exit=$?"

      # Der Lauf meldet sich in Daniels Statusanzeige — dort sieht er ihn neben
      # den Datenläufen, ohne GitHub zu öffnen. Die Datei bleibt die
      # ausführliche Fassung.
      # **Die Meldung trägt Repo, Workflow und Adresse mit — sonst steht in der
      # Anzeige „(ohne Namen)".**
      #
      # Genau das war beim ersten Lauf zu sehen (Daniel, 03.09.2026, mit Bild).
      # Den Namen bildet die Statusanzeige aus `workflow`; ohne ihn bleibt eine
      # rote Zeile ohne Absender, und wer sie sieht, weiß nicht, wo er nachsehen
      # soll. Die übrigen Läufe dieses Repos senden dieselben Felder.
      - name: Befund melden und rot werden
        if: steps.delta.outcome != 'success' || steps.kasten.outcome != 'success'
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: |
          if [ -n "$LAUF_TOKEN" ]; then
            printf '{"lauf_id":"%s","repo":"%s","workflow":"%s","zustand":"fehler","url":"%s","zweck":"%s","ziel":"%s","notiz":"%s"}' \
              "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              "Sieht täglich nach, ob Bestand oder Briefkasten etwas verloren haben" \
              "Auffälligkeiten stehen in daniel-zum-abarbeiten/00-wache.md" \
              "Auffälligkeit gefunden — Einzelheiten in daniel-zum-abarbeiten/00-wache.md" > /tmp/befund.json
            curl -sS --max-time 10 -X POST "https://newsletter.animekalender.workers.dev/lauf" \
              -H "Content-Type: application/json" -H "X-Lauf-Token: $LAUF_TOKEN" \
              --data-binary @/tmp/befund.json > /dev/null \
              || echo "Meldung an die Statusanzeige fehlgeschlagen — der rote Lauf bleibt trotzdem sichtbar."
          fi
          echo "::error::Auffälligkeit gefunden — Einzelheiten in daniel-zum-abarbeiten/00-wache.md"
          exit 1
