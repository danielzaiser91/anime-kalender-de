name: Claude — Auftrag abarbeiten

# Von Hand angestoßener Arbeitsauftrag. Gedacht für abgegrenzte Aufgaben, die
# über Nacht laufen sollen, während hier niemand am Rechner sitzt.
#
# Das Ergebnis ist **immer ein Pull Request**, nie ein Push auf main: main geht
# über `deploy.yml` direkt auf die Live-Seite, und was ohne Gegenblick dort
# landet, ist eine Veröffentlichung ohne Freigabe.
#
# Anmeldung über `CLAUDE_CODE_OAUTH_TOKEN` (Daniels Abo, keine getrennte
# API-Rechnung). Ohne `actions/checkout` bricht die Action still ab und der Lauf
# meldet trotzdem success — siehe ai_agent_learnings.md, Kategorie 30.

on:
  workflow_dispatch:
    inputs:
      auftrag:
        description: 'Was zu tun ist (wird wörtlich an Claude übergeben)'
        required: true
        type: string
      zweig:
        description: 'Name des Zweigs für den Pull Request'
        required: true
        type: string
      zweck:
        description: 'Eine Zeile für die Statusanzeige: wofür ist dieser Lauf?'
        required: false
        default: ''
        type: string
      modell:
        description: 'Modell'
        required: false
        default: 'claude-opus-5'
        type: string
      schritte:
        description: 'Obergrenze an Zügen'
        required: false
        default: '150'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

# Zwei Claudes am selben Repo erzeugen widersprüchliche Pull Requests. Ein
# zweiter Auftrag wartet deshalb, statt parallel zu laufen.
concurrency:
  group: claude-auftrag
  cancel-in-progress: false

jobs:
  arbeiten:
    runs-on: ubuntu-latest
    # Zweck und Ziel gehen an die Statusanzeige mit. Ohne sie steht dort nur
    # der Workflow-Name, und der sagt bei drei Auftrags-Läufen dreimal
    # dasselbe (Daniel, 21.08.2026: „Zweck sollte kurz beschreiben wofür
    # dieser lauf ist"). Der Lauf weiß es, die Anzeige nicht — also liefert
    # er es mit.
    env:
      LAUF_ZWECK: "${{ inputs.zweck || format('Arbeitsauftrag an Claude: {0}', inputs.zweig) }}"
      LAUF_ZIEL: "Pull Request auf Zweig ${{ inputs.zweig }}, Prüfkette grün"
    timeout-minutes: 120
    steps:
      # Sofort anmelden, noch vor allem anderen.
      #
      # Der Schritt weiter unten braucht das ausgecheckte Skript und läuft
      # deshalb erst nach Checkout und npm-Einrichtung — das sind dreißig bis
      # sechzig Sekunden, in denen die Statusanzeige nichts weiß. Daniel am
      # 21.08.2026: „der läuft sogar schon seit 1min aber ist erst jetzt in
      # der app aufgetaucht."
      #
      # Ein curl braucht nichts als das Token. Schlägt er fehl, läuft der Job
      # weiter — die spätere Anmeldung holt es nach.
      - name: Sofort anmelden
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: |
          if [ -z "$LAUF_TOKEN" ]; then exit 0; fi
          printf '{"lauf_id":"%s","repo":"%s","workflow":"%s","zweck":"%s","ziel":"%s","zustand":"laeuft","url":"%s","notiz":"wird eingerichtet"}' \
            "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" \
            "$(printf %s "$LAUF_ZWECK" | tr -d '\\"')" "$(printf %s "$LAUF_ZIEL" | tr -d '\\"')" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/anmeldung.json
          curl -sS --max-time 10 -X POST "https://newsletter.animekalender.workers.dev/lauf" \
            -H "Content-Type: application/json" -H "X-Lauf-Token: $LAUF_TOKEN" \
            --data-binary @/tmp/anmeldung.json > /dev/null || true


      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50

      # Meldet der Statusanzeige, dass hier etwas läuft. Ohne LAUF_TOKEN
      # passiert nichts — eine fehlende Meldung darf keinen Lauf rot machen.
      # Das Meldeskript an einen Ort legen, den kein Zweigwechsel wegnimmt.
      #
      # Am 21.08.2026 hat ein Auftrags-Lauf seinen eigenen Zweig angelegt und
      # ist dorthin gewechselt — auf dem gab es `tools/lauf-melden.sh` noch
      # nicht. Die Abmeldung scheiterte mit Exit 127 und machte einen Lauf rot,
      # dessen Arbeit fertig und richtig war.
      - name: Melder bereitlegen
        run: |
          cp tools/lauf-melden.sh "$RUNNER_TEMP/lauf-melden.sh"
          echo "MELDER=$RUNNER_TEMP/lauf-melden.sh" >> "$GITHUB_ENV"

      - name: Lauf anmelden
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          LAUF_AUFTRAG: ${{ inputs.zweig }}
        run: bash "$MELDER" laeuft

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lebenszeichen mit Inhalt, solange der Auftrag arbeitet.
      #
      # Ein Auftrags-Lauf hat keine zählbare Menge wie „560 von 959 Serien" — er
      # schreibt Code, und wie viel davon noch kommt, weiß er selbst nicht.
      # Gemeldet wird deshalb, was sich ehrlich messen lässt:
      #
      #   Balken  die verbrauchte Zeit gegen die Obergrenze des Jobs. Das ist
      #           kein Arbeitsfortschritt, aber es beantwortet die Frage, die
      #           Daniel am 21.08.2026 gestellt hat: „ich sehe nicht wieviele
      #           noch offen sind, es ist wirklich schlecht das einzuschätzen."
      #   Text    Commits seit Beginn und der Betreff des letzten. Daran ist
      #           ablesbar, woran er gerade sitzt.
      #
      # Was hier früher stand — „51 Commits" — war Unsinn: `git rev-list` zählt
      # die mitgeklonte Historie mit (fetch-depth 50), die Zahl begann also bei
      # 50. Und „121 Dateien offen" waren 121 Rohdaten-Dateien aus einem
      # Testabruf, kein Arbeitsstand.
      #
      # Läuft im Hintergrund und endet mit dem Job.
      - name: Fortschritt im Hintergrund melden
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          LAUF_AUFTRAG: ${{ inputs.zweig }}
          LAUF_GRENZE_MIN: '120'
        run: |
          if [ -z "$LAUF_TOKEN" ]; then exit 0; fi
          START_SEK=$(date +%s)
          START_COMMITS=$(git rev-list --count HEAD 2>/dev/null || echo 0)
          export START_SEK START_COMMITS
          nohup bash -c '
            while true; do
              sleep 30
              MIN=$(( ( $(date +%s) - START_SEK ) / 60 ))
              N=$(git status --porcelain 2>/dev/null | wc -l | tr -d " ")
              C=$(( $(git rev-list --count HEAD 2>/dev/null || echo 0) - START_COMMITS ))
              [ "$C" -lt 0 ] && C=0
              LETZTER=$(git log -1 --format=%s 2>/dev/null | tr -d "\\\\\"" | cut -c1-60)
              TEXT="$C Commits"
              [ -n "$LETZTER" ] && [ "$C" -gt 0 ] && TEXT="$TEXT · zuletzt: $LETZTER"
              [ "$N" -gt 0 ] && TEXT="$TEXT · $N Dateien ungespeichert"
              printf "{\"lauf_id\":\"%s\",\"zustand\":\"laeuft\",\"auftrag\":\"%s\",\"fortschritt\":%s,\"fortschritt_gesamt\":%s,\"fortschritt_text\":\"%s\"}" \
                "$GITHUB_RUN_ID" "$LAUF_AUFTRAG" "$MIN" "$LAUF_GRENZE_MIN" "$TEXT" > /tmp/fortschritt.json
              curl -sS --max-time 8 -X POST "https://newsletter.animekalender.workers.dev/lauf" \
                -H "Content-Type: application/json" -H "X-Lauf-Token: $LAUF_TOKEN" \
                --data-binary @/tmp/fortschritt.json > /dev/null 2>&1 || true
            done
          ' > /dev/null 2>&1 &
          echo "Hintergrund-Melder gestartet"


      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          # Ohne diese Zeilen sieht der Lauf die Schlüssel nicht — sie liegen
          # zwar als Repo-Secret bereit, erreichen den Prozess aber nur, wenn
          # sie hier stehen. Am 21.08.2026 hat ein Auftrag deshalb die ganze
          # Anbindung gebaut und keinen einzigen Abruf zustande gebracht.
          STREAMING_API_KEY: ${{ secrets.STREAMING_API_KEY }}
          CR_ZUGANG: ${{ secrets.CR_ZUGANG }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'github-actions[bot]'
          claude_args: |
            --max-turns ${{ inputs.schritte }}
            --model ${{ inputs.modell }}
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob"
          prompt: |
            Arbeitsauftrag für dieses Repo. Du arbeitest allein, es sitzt niemand
            daneben — frage nicht nach, sondern entscheide und begründe im Pull
            Request, was du entschieden hast.

            ## Der Auftrag

            ${{ inputs.auftrag }}

            ## Wie du arbeitest

            1. **Erst nachsehen, dann ändern.** Lies die genannten Dateien wirklich,
               statt aus ihren Namen zu schließen.
            2. Ändere so wenig wie möglich, aber den Auftrag vollständig. Bleibt ein
               Teil blockiert, erledige alle übrigen und schreibe im Pull Request
               ausdrücklich, was du weggelassen hast und warum.
            3. **Prüfkette muss grün sein, bevor du committest:**
               `npm run data:validate && npm run check:logic && npm run typecheck && npm run check:worker && npm run check:hooks && npm run build`
            4. **Push früh, nicht erst am Ende.** Sobald die erste Änderung steht,
               legst du den Zweig `${{ inputs.zweig }}` an und pushst ihn — auch
               unfertig. Danach arbeitest du weiter und pushst nach. Läuft dieser
               Lauf in seine Obergrenze an Zügen, ist sonst **alles weg**: Der
               Rechner wird abgeräumt, und niemand kann nachsehen, wie weit du
               warst. Genau das ist am 20.08.2026 passiert.
            5. **Dateien unter `.github/workflows/` kannst du nicht ändern.** Das
               Token dieses Laufs hat kein `workflows`-Recht, der Push wird
               abgelehnt. Brauchst du dort eine Änderung, schreib sie als Diff in
               den Pull-Request-Text, statt es zu versuchen.
            6. **`npm run build` dauert Minuten.** Ruf ihn gezielt auf, nicht nach
               jeder Zeile — sonst geht die Laufzeit fürs Bauen statt für die Arbeit drauf.
            7. Committe auf den Zweig `${{ inputs.zweig }}` und öffne einen
               Pull Request gegen `main`:
               `git switch -c ${{ inputs.zweig }} && git add -A && git commit && git push -u origin ${{ inputs.zweig }} && gh pr create --fill`
               **Niemals direkt auf `main` pushen** — das deployt sofort auf die
               Live-Seite.
            8. In den Pull-Request-Text gehören: was geändert wurde, womit du es
               belegt hast, und was du bewusst nicht angefasst hast.

            ## Verbindlich

            - `CLAUDE.md` im Wurzelverzeichnis gilt vollständig. Der wichtigste Satz
              daraus: **nichts behaupten, was nicht belegt ist.** Kein geratener
              Termin, keine geratene Folgenzahl, keine geratene Uhrzeit — lieber
              „unbekannt" als eine plausible Falschangabe.
            - Eine Zusicherung, die abbricht, ist nicht das Problem. Sie weicher zu
              stellen, um einen grünen Lauf zu bekommen, ist ausdrücklich falsch.
            - Alles auf Deutsch: Kommentare, Commit-Nachricht, Pull-Request-Text.
              Fachbegriffe bleiben Fachbegriffe, keine erfundene Eindeutschung.
            - Kommentare erklären das **Warum**, nicht das Was — so wie die
              vorhandenen im Projekt. Ein Kommentar, der die Zeile darunter noch
              einmal auf Deutsch sagt, wird nicht geschrieben.

      # Läuft auch nach einem Fehler: Der rote Lauf ist der, den man sehen will.
      - name: Lauf abmelden
        continue-on-error: true
        if: always()
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          LAUF_AUFTRAG: ${{ inputs.zweig }}
        run: bash "$MELDER" "${{ job.status == 'success' && 'ok' || job.status == 'cancelled' && 'abgebrochen' || 'fehler' }}"
