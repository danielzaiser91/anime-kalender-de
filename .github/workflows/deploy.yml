name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
    # Was die ausgelieferte Seite nicht berührt, braucht keinen Deploy.
    #
    # Am 23.08.2026 liefen in einer halben Stunde sieben volle Deploys, weil
    # jeder Commit an der Browser-Erweiterung den Website-Bau anstieß (Daniel:
    # „wieso seh ich eigentlich so viele deploy im status app?"). Die
    # Erweiterung wird nicht ausgeliefert, sie wird von Hand in Chrome geladen;
    # der Worker hat seinen eigenen Weg über `wrangler deploy`.
    #
    # **Wirkt nur, wenn ein Commit ausschließlich solche Pfade anfasst.** Wer
    # Erweiterung und Web-Quelltext zusammen ändert, bekommt weiterhin einen
    # Deploy — und das ist richtig so.
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'extension/**'
      - 'worker/**'
  # Ohne das hier gehen die Daten der Nachtläufe nie live. GitHub startet
  # bewusst keine Workflows für Pushes, die aus einer Action mit dem
  # GITHUB_TOKEN kommen — sonst könnte sich eine Action endlos selbst
  # auslösen. Folge: Der Datenlauf committet, `push` schweigt, die Seite
  # zeigt weiter den Stand von gestern. Aufgefallen ist das nur zufällig,
  # weil an einem Tag jemand von Hand gepusht und damit fremde Daten
  # mitdeployt hat. `workflow_run` fällt nicht unter die Regel.
  workflow_run:
    workflows:
      # Nur noch der Bau-Lauf: Die drei Sammler committen seit dem 30.08.2026 nur
      # Quellen und erzeugen keinen neuen Datensatz mehr, den man ausliefern
      # könnte.
      - 'Bestand — zusammenführen und bauen'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Für das Aufräumen der Statusanzeige: `gh run list` liest die Läufe des Repos.
  actions: read

concurrency:
  # Pushes der Daten-App überspringt der Job-`if`; der Lauf selbst bekäme sonst die Gruppe und verdrängte einen wartenden Deploy.
  # Ebenso ein workflow_run-Lauf nach nicht erfolgreichem Bestandsbau (16.10.2026: er verdrängte den push-Deploy und übersprang sich dann selbst).
  # Kein Lauf bricht einen laufenden Deploy ab, er wartet; ein neuerer wartender ersetzt den älteren (GitHub hält je Gruppe nur einen).
  # Vorher brach jeder Merge den laufenden ab: 60 von ~290 Deploys in 7 Tagen, ein Live-Fix kam je Merge ~8 min später (26.10.2026).
  group: ${{ (github.event_name == 'push' && github.actor == 'anime-kalender-daten[bot]') && format('app-push-{0}', github.run_id) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success') && format('uebersprungen-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: false

jobs:
  # **Zwei Wege zum Deploy** (Daniel, 08.10.2026): Der Bau und die Prüfungen laufen nebeneinander. **Hart** (Standard): Deployt wird erst, wenn beides grün ist.
  # **Schlank** (`[schlank]` in der Commit-Nachricht, gesetzt von `bash tools/pushen.sh --schlank`): Für kleine Änderungen, die lokal vollständig geprüft sind. Deployt wird
  # gleich nach dem Bau; die Prüfungen laufen weiter und melden sich rot, wenn doch etwas nicht stimmt.
  # **Deploy aus dem geprüften Build** (16.10.2026): Hat die PR-Prüfkette genau diesen Quelltext schon gebaut und geprüft, wird ihr Artefakt ausgeliefert
  # (Beweis und Rückfälle: tools/deploy-aus-build.mjs, Baum in version.json). Dann entfallen in `build` und `pruefen` alle Schritte nach dem Hochladen bzw. der Herkunftsprüfung; ohne Treffer läuft alles wie bisher.
  # **Drei Hops statt sechs** (10.11.2026): GitHub kennt keine Prioritäten, jeder Job reiht sich neu in die Runner-Warteschlange ein (Bericht CI-Stau). Der frühere Job `herkunft`
  # ist als Composite-Schritt (`.github/actions/herkunft-holen`) an den Anfang von `build` und `pruefen` gewandert; beide Jobs laufen weiter parallel. Das Artefakt lädt nur `build` hoch.
  # Beide Jobs haben die Rechte des früheren `herkunft` (die Herkunftsprüfung liest Pull Requests und Läufe); `pages`/`id-token` brauchen nur die Deploy-Jobs.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Urteil der Herkunftsprüfung; `deploy_hart` verlangt, dass es mit dem von `pruefen` übereinstimmt (kein Deploy ohne Prüflauf).
    outputs:
      treffer: ${{ steps.herkunft.outputs.treffer }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # Zweck und Ziel gehen an die Statusanzeige mit. Ohne sie steht dort nur
    # der Workflow-Name, und der sagt bei drei Auftrags-Läufen dreimal
    # dasselbe (Daniel, 21.08.2026: „Zweck sollte kurz beschreiben wofür
    # dieser lauf ist"). Der Lauf weiß es, die Anzeige nicht — also liefert
    # er es mit.
    env:
      LAUF_ZWECK: "Veröffentlicht den aktuellen Stand von anime-kalender.de"
      LAUF_ZIEL: "Prüfkette grün, neuer Stand auf GitHub Pages"
      LAUF_SCHRITTE: '6'
    # Ein gescheiterter Datenlauf soll nichts veröffentlichen. Bei den anderen
    # Auslösern (push, workflow_dispatch) ist das Feld leer, deshalb die
    # Oder-Bedingung — sonst würde der Deploy von Hand nie mehr starten.
    if: >-
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success') &&
      !(github.event_name == 'push' && github.actor == 'anime-kalender-daten[bot]')
    steps:
      # Sofort anmelden, noch vor allem anderen.
      #
      # Der Schritt weiter unten braucht das ausgecheckte Skript und läuft
      # deshalb erst nach dem Checkout — das sind dreißig bis
      # sechzig Sekunden, in denen die Statusanzeige nichts weiß. Daniel am
      # 21.08.2026: „der läuft sogar schon seit 1min aber ist erst jetzt in
      # der app aufgetaucht."
      #
      # Ein curl braucht nichts als das Token. Schlägt er fehl, läuft der Job
      # weiter — die spätere Anmeldung holt es nach.
      - name: Sofort anmelden
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: |
          if [ -z "$LAUF_TOKEN" ]; then exit 0; fi
          printf '{"lauf_id":"%s","repo":"%s","workflow":"%s","zustand":"laeuft","url":"%s","notiz":"wird eingerichtet"}' \
            "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/anmeldung.json
          curl -sS --max-time 10 -X POST "https://newsletter.animekalender.workers.dev/lauf" \
            -H "Content-Type: application/json" -H "X-Lauf-Token: $LAUF_TOKEN" \
            --data-binary @/tmp/anmeldung.json > /dev/null || true


      # Zunächst nur `tools` mit Verlauf (Herkunftsprüfung braucht den Elterncommit).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            tools
            .github/actions

      # Meldet der Statusanzeige, dass hier etwas läuft. Ohne LAUF_TOKEN
      # passiert nichts — eine fehlende Meldung darf keinen Lauf rot machen.
      # Das Meldeskript an einen Ort legen, den kein Zweigwechsel wegnimmt.
      #
      # Am 21.08.2026 hat ein Auftrags-Lauf seinen eigenen Zweig angelegt und
      # ist dorthin gewechselt — auf dem gab es `tools/lauf-melden.sh` noch
      # nicht. Die Abmeldung scheiterte mit Exit 127 und machte einen Lauf rot,
      # dessen Arbeit fertig und richtig war.
      - name: Melder bereitlegen
        run: |
          cp tools/lauf-melden.sh "$RUNNER_TEMP/lauf-melden.sh"
          echo "MELDER=$RUNNER_TEMP/lauf-melden.sh" >> "$GITHUB_ENV"

      - name: Lauf anmelden
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" laeuft

      # `[schlank]` baut weiter selbst (Weg ohne Prüfkette). Jeder Fehler hier heißt nur „kein Treffer“.
      - name: Herkunft prüfen
        id: herkunft
        timeout-minutes: 5
        uses: ./.github/actions/herkunft-holen

      - name: Artefakt für die Veröffentlichung hochladen
        id: hochladen
        continue-on-error: true
        if: ${{ steps.herkunft.outputs.treffer == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      # Ab hier nur ohne Treffer (oder wenn der Upload scheiterte). Der Rest des Checkouts folgt erst jetzt (Blobs lädt Git nach).
      - name: Vollständig auschecken
        if: ${{ steps.hochladen.outcome != 'success' }}
        run: git sparse-checkout disable

      - uses: actions/setup-node@v4
        if: ${{ steps.hochladen.outcome != 'success' }}
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: ${{ steps.hochladen.outcome != 'success' }}

      - name: Fortschritt — Abhängigkeiten installiert
        if: ${{ steps.hochladen.outcome != 'success' }}
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Abhängigkeiten installiert"

      - name: Bauen
        if: ${{ steps.hochladen.outcome != 'success' }}
        env:
          PAGES_BASE: /
          VITE_NEWSLETTER_API: ${{ vars.NEWSLETTER_API_URL }}
          SCHLANK: ${{ contains(github.event.head_commit.message, '[schlank]') && '1' || '' }}
        run: |
          if [ -n "$SCHLANK" ]; then npm run build:schlank; else npm run build; fi

      - name: Fortschritt — Seite gebaut
        if: ${{ steps.hochladen.outcome != 'success' }}
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Seite gebaut"

      # Hier stand bis zum 17.08.2026 ein SPA-Fallback: cp dist/index.html
      # dist/404.html. Er ist weg, und zwar aus zwei Gründen.
      #
      # Erstens braucht ihn diese Anwendung nicht. Sie routet über den Hash;
      # echte Pfade gibt es nur drei — /, /termine/ und /r/<slug>/ —, und alle
      # drei liegen als Datei im Bauwerk. Ein anderer Pfad ist wirklich nicht
      # vorhanden.
      #
      # Zweitens richtete er Schaden an: Seit die Startseite vorgerenderten
      # Inhalt trägt, lieferte jeder unbekannte Pfad eine vollständig
      # aussehende Seite unter dem Status 404 aus. Für Google ist das eine
      # „Soft 404" — er sieht Inhalt, wo ein Fehler gemeldet wird.
      #
      # public/404.html übernimmt: richtiger Status, passender Inhalt, ein Weg
      # zurück zum Kalender, und noindex.

      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.hochladen.outcome != 'success' }}
        with:
          path: dist

      - name: Fortschritt — Artefakt hochgeladen
        if: ${{ steps.hochladen.outcome != 'success' }}
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Artefakt hochgeladen"

  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      treffer: ${{ steps.herkunft.outputs.treffer }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      LAUF_ZWECK: "Veröffentlicht den aktuellen Stand von anime-kalender.de"
      LAUF_ZIEL: "Prüfkette grün, neuer Stand auf GitHub Pages"
      LAUF_SCHRITTE: '6'
    if: >-
      (github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success') &&
      !(github.event_name == 'push' && github.actor == 'anime-kalender-daten[bot]')
    steps:
      # Zunächst nur `tools` mit Verlauf für die Herkunftsprüfung und den Logik-Beleg (tools/logik-beleg.mjs): Commit-Nachrichten der letzten 30, ohne ihre Inhalte.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
          filter: blob:none
          sparse-checkout: |
            tools
            .github/actions

      # Dieselbe Prüfung wie in `build`; bei Treffer entfallen alle folgenden Schritte (der Job bleibt grün, die Prüfung der PR-Kette gilt).
      - name: Herkunft prüfen
        id: herkunft
        timeout-minutes: 5
        uses: ./.github/actions/herkunft-holen

      - name: Vollständig auschecken
        if: ${{ steps.herkunft.outputs.treffer != '1' }}
        run: git sparse-checkout disable

      # Hat der Bestandsbau `check:logic` für genau diesen Inhalt (außerhalb der Datenpfade) schon grün gefahren, steht der Abdruck in
      # seiner Commit-Nachricht und der Lauf unten spart die ~3 min. Jeder Fehler hier heißt nur „nicht belegt“: dann läuft die Prüfung.
      - name: Logik-Beleg des Bestandsbaus lesen
        id: beleg
        if: ${{ steps.herkunft.outputs.treffer != '1' }}
        run: node tools/logik-beleg.mjs gueltig

      # Hat ein früherer Deploy-Lauf für denselben Inhalt außerhalb der Datenpfade `pruefen` grün gefahren (tools/workflows-beleg.mjs),
      # entfällt `check:workflows` (~7 min). Jeder Fehler hier heißt nur „nicht belegt“: dann läuft die Prüfung wie bisher.
      - name: Workflows-Beleg früherer Deploy-Läufe suchen
        id: wbeleg
        if: ${{ steps.herkunft.outputs.treffer != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/workflows-beleg.mjs gueltig

      # Meldet der Statusanzeige, dass hier etwas läuft. Ohne LAUF_TOKEN
      # passiert nichts — eine fehlende Meldung darf keinen Lauf rot machen.
      # Das Meldeskript an einen Ort legen, den kein Zweigwechsel wegnimmt.
      #
      # Am 21.08.2026 hat ein Auftrags-Lauf seinen eigenen Zweig angelegt und
      # ist dorthin gewechselt — auf dem gab es `tools/lauf-melden.sh` noch
      # nicht. Die Abmeldung scheiterte mit Exit 127 und machte einen Lauf rot,
      # dessen Arbeit fertig und richtig war.
      - name: Melder bereitlegen
        run: |
          cp tools/lauf-melden.sh "$RUNNER_TEMP/lauf-melden.sh"
          echo "MELDER=$RUNNER_TEMP/lauf-melden.sh" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: ${{ steps.herkunft.outputs.treffer != '1' }}
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: ${{ steps.herkunft.outputs.treffer != '1' }}

      - name: Fortschritt — Abhängigkeiten installiert
        if: ${{ steps.herkunft.outputs.treffer != '1' }}
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Abhängigkeiten installiert"

      - name: Kuratierte Daten prüfen
        if: ${{ steps.herkunft.outputs.treffer != '1' }}
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:validate

      - name: Fortschritt — Kuratierte Daten geprüft
        if: ${{ steps.herkunft.outputs.treffer != '1' }}
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Kuratierte Daten geprüft"

      # Ein kaputter Workflow meldet sich nicht — er verschwindet lautlos aus
      # der Übersicht und läuft nie wieder. Diese Prüfung ist der einzige Ort,
      # der das bemerkt, bevor ein Nachtlauf ausbleibt.
      - name: Workflow-Dateien prüfen
        if: ${{ steps.herkunft.outputs.treffer != '1' && steps.wbeleg.outputs.gueltig != '1' }}
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run check:workflows

      - name: Fortschritt — Workflow-Dateien geprüft
        if: ${{ steps.herkunft.outputs.treffer != '1' }}
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Workflow-Dateien geprüft"

      # Die Zusicherungen aus der Prüfkette vor dem Commit. Sie gehören auch
      # hierher: Die Nachtläufe committen ohne menschlichen Blick, und der
      # Fehler vom 12.08.2026 (196 erfundene Termine) entstand genau dort.
      #
      # `check:handbelege` steht seit dem 23.08.2026 dabei. Es hält die 1.946
      # von Daniel selbst geprüften Angaben gegen den gebauten Datensatz —
      # die einzige Quelle im Projekt, die weder rät noch schweigt, und die
      # teuerste, weil sie seine Zeit kostet. Ihr Schutz bestand bis dahin nur
      # aus der Reihenfolge in `build.ts`, und Reihenfolgen brechen leise:
      # Wer eine Quelle nach oben zieht, sieht danach einen Datensatz, der
      # genauso vollständig aussieht — nur steht an einzelnen Stellen die
      # Vermutung einer Quelle, wo eine Messung stand.
      #
      # `check:adn-gedaechtnis` seit dem 24.08.2026. Es sichert die einzige
      # Stelle im Bau, die Angaben **erzeugt**, statt sie zu übernehmen: den
      # Rückschluss von einer belegten Folge auf die davor. Die wichtigste
      # Zusicherung dort ist nicht, dass etwas ergänzt wird, sondern dass
      # nichts über den höchsten gesehenen Fund hinaus ergänzt wird — eine
      # erfundene Tonspur vermisst niemand.
      # Hier steht nur noch, was der Deploy verantwortet: den Code.
      #
      # **Sieben von acht roten Läufen kamen aus einer Reihenfolge, nicht aus
      # einem Fehler** (gemessen am 27.08.2026 über die letzten 60 Läufe). Die
      # Zusicherungen `check:handbelege`, `check:cr-zuordnung`, `check:quellen`,
      # `check:adn-gedaechtnis` und `check:zugangsart` messen den **Datenbestand**.
      # Wer Code pusht, dessen Wirkung erst der nächste Bau zeigt, hatte deshalb
      # zwangsläufig einen roten Deploy — der Datensatz im Repo war der von
      # vorhin, und der Deploy konnte daran nichts ändern.
      #
      # Sie laufen jetzt in `tools/commit-data.sh`, direkt nach dem Bau: Dort
      # ist der Bestand gerade entstanden, dort hält eine rote Prüfung ihn auf,
      # bevor er ins Repo kommt, und dort ist ein roter Lauf ein echter Befund.
      #
      # Was hier bleibt, prüft den Quelltext und ist damit vollständig durch
      # den Commit bestimmt, der den Deploy ausgelöst hat.
      - name: Zusicherungen prüfen
        if: ${{ steps.herkunft.outputs.treffer != '1' }}
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          LOGIK_BELEGT: ${{ steps.beleg.outputs.gueltig }}
        run: |
          npm run check:pfade
          if [ "$LOGIK_BELEGT" = 1 ]; then
            echo "check:logic übersprungen: vom Bestandsbau für diesen Inhalt belegt (Schritt „Logik-Beleg“)."
          else
            npm run check:logic
          fi
          npm run check:search

      - name: Fortschritt — Zusicherungen geprüft
        if: ${{ steps.herkunft.outputs.treffer != '1' }}
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Zusicherungen geprüft"

      # Hooks-Regeln sieht weder `tsc -b` noch der Vite-Build: Ein Verstoß ist
      # gültiges TypeScript und baut fehlerfrei durch — er schlägt erst im
      # Browser zu. Am 20.08.2026 ging die ganze Seite deshalb weiß auf den
      # Server (React #310), und der Service Worker hielt das kaputte Bundle
      # danach am Leben. Die Prüfung läuft zwar ohnehin in `npm run build`;
      # hier steht sie eigens, damit der Lauf den Fehler beim Namen nennt
      # statt ihn als Baufehler zu melden.
      - name: Hooks-Regeln prüfen
        if: ${{ steps.herkunft.outputs.treffer != '1' }}
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run check:hooks

      # Die Zusicherungen der Erweiterung. Sie lagen bis zum 23.08.2026 in
      # keiner Kette und liefen deshalb genau einmal — an dem Tag, an dem sie
      # geschrieben wurden.
      - name: Erweiterung prüfen
        if: ${{ steps.herkunft.outputs.treffer != '1' }}
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run check:extension

      # Die Zugangsart ist die einzige Angabe, bei der ein Fehler den Leser
      # Geld kostet — „kostenlos" vor einer Kasse.
      - name: Fortschritt — Hooks-Regeln geprüft
        if: ${{ steps.herkunft.outputs.treffer != '1' }}
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Hooks-Regeln geprüft"

  # Beide Jobs grün: Bau und Prüfung gelaufen oder (Treffer) das Artefakt der PR-Prüfkette liegt, dann entfallen die Schritte, die Jobs bleiben grün.
  # `!cancelled()` ist nötig, weil übersprungene Needs den Job sonst mitüberspringen.
  deploy_hart:
    needs: [build, pruefen]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.pruefen.result == 'success' &&
      !contains(github.event.head_commit.message, '[schlank]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fail-closed (Prüfer 3367 A3): Urteilen `build` und `pruefen` verschieden über die Herkunft (API-Ausfall nur in einem Job), ginge sonst ein
      # selbst gebauter Stand ohne Prüflauf live. Dann kein Deploy, Lauf rot; ein neuer Lauf entscheidet erneut.
      - name: Herkunft von build und pruefen vergleichen
        env:
          BAU_TREFFER: ${{ needs.build.outputs.treffer }}
          PRUEF_TREFFER: ${{ needs.pruefen.outputs.treffer }}
        run: |
          if [ "$BAU_TREFFER" != "$PRUEF_TREFFER" ]; then
            echo "::error::Kein Deploy: build (Treffer '${BAU_TREFFER}') und pruefen (Treffer '${PRUEF_TREFFER}') haben die Herkunft verschieden beurteilt. Lauf neu starten."
            exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@v4

  deploy_schlank:
    needs: build
    if: ${{ contains(github.event.head_commit.message, '[schlank]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Abmeldung und Aufräumen nach allen Jobs: Sie brauchen das Meldeskript (Auscheckvorgang) und den Gesamtstand.
  # Danach (30.10.2026): Kachelränder an der ausgelieferten Seite, dieselbe Pixelmessung wie in der PR-Kette, aber gegen die echte Adresse (Service Worker gesperrt, fremde Bilder ersetzt).
  # Ein Befund macht nur diese Schritte rot (`continue-on-error`), nie den Deploy und nie die Abmeldung (sie steht davor). Der Job hält die Gruppe `pages`,
  # daher eine Frist an jedem Schritt (Test: deploy-aus-build.test.mjs): Checkout 2, Melder 1, Abmeldung 1, Aufräumen 3 (ein hängender Checkout hielt die Gruppe am 16.10.2026 sechs Minuten, normal unter einer),
  # Einrichten 4, Messung 8 (lokal gegen live 3 x ca. 117 s, 30.10.2026) = 19 min, Job-Frist 20: die Job-Frist greift nie vor einer Schritt-Frist (kein Job-Abbruch, der den Lauf rot macht).
  # Einrichten und Messung stehen auf `continue-on-error`: ein Hänger dort bleibt ein Befund der Messung, kein roter Lauf.
  abschluss:
    needs: [build, pruefen, deploy_hart, deploy_schlank]
    if: always() && needs.build.result != 'skipped'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      LAUF_ZWECK: "Veröffentlicht den aktuellen Stand von anime-kalender.de"
      LAUF_ZIEL: "Prüfkette grün, neuer Stand auf GitHub Pages"
      LAUF_SCHRITTE: '6'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Melder bereitlegen
        timeout-minutes: 1
        run: |
          cp tools/lauf-melden.sh "$RUNNER_TEMP/lauf-melden.sh"
          echo "MELDER=$RUNNER_TEMP/lauf-melden.sh" >> "$GITHUB_ENV"

      - name: Lauf abmelden
        timeout-minutes: 1
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" "${{ contains(needs.*.result, 'failure') && 'fehler' || contains(needs.*.result, 'cancelled') && 'abgebrochen' || 'ok' }}"

      # **Überholte rote Läufe verschwinden von selbst** (18.09.2026): nur Läufe, deren Workflow danach grün durchlief.
      - name: Überholte rote Läufe abnehmen
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        timeout-minutes: 3
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$LAUF_TOKEN" ]; then exit 0; fi
          node tools/laeufe-aufraeumen.mjs

      - uses: ./.github/actions/kette-einrichten
        if: ${{ !cancelled() && (needs.deploy_hart.result == 'success' || needs.deploy_schlank.result == 'success') }}
        timeout-minutes: 4
        continue-on-error: true
        with:
          playwright: 'true'

      - name: Kachelränder live messen
        if: ${{ !cancelled() && (needs.deploy_hart.result == 'success' || needs.deploy_schlank.result == 'success') }}
        timeout-minutes: 8
        continue-on-error: true
        run: node tools/kachel-ecken-messen.mjs --live
