name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  # Ohne das hier gehen die Daten der Nachtläufe nie live. GitHub startet
  # bewusst keine Workflows für Pushes, die aus einer Action mit dem
  # GITHUB_TOKEN kommen — sonst könnte sich eine Action endlos selbst
  # auslösen. Folge: Der Datenlauf committet, `push` schweigt, die Seite
  # zeigt weiter den Stand von gestern. Aufgefallen ist das nur zufällig,
  # weil an einem Tag jemand von Hand gepusht und damit fremde Daten
  # mitdeployt hat. `workflow_run` fällt nicht unter die Regel.
  workflow_run:
    workflows:
      - 'Stündlich — Sendezeiten'
      - 'Täglich — alle Quellen'
      - 'Wöchentlich — tiefer Durchlauf'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Ein gescheiterter Datenlauf soll nichts veröffentlichen. Bei den anderen
    # Auslösern (push, workflow_dispatch) ist das Feld leer, deshalb die
    # Oder-Bedingung — sonst würde der Deploy von Hand nie mehr starten.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      # Meldet der Statusanzeige, dass hier etwas läuft. Ohne LAUF_TOKEN
      # passiert nichts — eine fehlende Meldung darf keinen Lauf rot machen.
      - name: Lauf anmelden
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash tools/lauf-melden.sh laeuft

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kuratierte Daten prüfen
        run: npm run data:validate

      # Ein kaputter Workflow meldet sich nicht — er verschwindet lautlos aus
      # der Übersicht und läuft nie wieder. Diese Prüfung ist der einzige Ort,
      # der das bemerkt, bevor ein Nachtlauf ausbleibt.
      - name: Workflow-Dateien prüfen
        run: npm run check:workflows

      # Die Zusicherungen aus der Prüfkette vor dem Commit. Sie gehören auch
      # hierher: Die Nachtläufe committen ohne menschlichen Blick, und der
      # Fehler vom 12.08.2026 (196 erfundene Termine) entstand genau dort.
      - name: Zusicherungen prüfen
        run: npm run check:logic && npm run check:search

      # Hooks-Regeln sieht weder `tsc -b` noch der Vite-Build: Ein Verstoß ist
      # gültiges TypeScript und baut fehlerfrei durch — er schlägt erst im
      # Browser zu. Am 20.08.2026 ging die ganze Seite deshalb weiß auf den
      # Server (React #310), und der Service Worker hielt das kaputte Bundle
      # danach am Leben. Die Prüfung läuft zwar ohnehin in `npm run build`;
      # hier steht sie eigens, damit der Lauf den Fehler beim Namen nennt
      # statt ihn als Baufehler zu melden.
      - name: Hooks-Regeln prüfen
        run: npm run check:hooks

      - name: Bauen
        env:
          PAGES_BASE: /
          VITE_NEWSLETTER_API: ${{ vars.NEWSLETTER_API_URL }}
        run: npm run build

      # Hier stand bis zum 17.08.2026 ein SPA-Fallback: cp dist/index.html
      # dist/404.html. Er ist weg, und zwar aus zwei Gründen.
      #
      # Erstens braucht ihn diese Anwendung nicht. Sie routet über den Hash;
      # echte Pfade gibt es nur drei — /, /termine/ und /r/<slug>/ —, und alle
      # drei liegen als Datei im Bauwerk. Ein anderer Pfad ist wirklich nicht
      # vorhanden.
      #
      # Zweitens richtete er Schaden an: Seit die Startseite vorgerenderten
      # Inhalt trägt, lieferte jeder unbekannte Pfad eine vollständig
      # aussehende Seite unter dem Status 404 aus. Für Google ist das eine
      # „Soft 404" — er sieht Inhalt, wo ein Fehler gemeldet wird.
      #
      # public/404.html übernimmt: richtiger Status, passender Inhalt, ein Weg
      # zurück zum Kalender, und noindex.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Abmeldung im selben Job wie die Anmeldung. Der Job "deploy" darunter
      # hat keinen Auscheckvorgang — dort gäbe es dieses Skript gar nicht,
      # und ein gescheiterter Meldeschritt hätte jeden erfolgreichen Deploy
      # rot gemacht.
      - name: Lauf abmelden
        if: always()
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash tools/lauf-melden.sh "${{ job.status == 'success' && 'ok' || job.status == 'cancelled' && 'abgebrochen' || 'fehler' }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
