name: Wöchentlich — tiefer Durchlauf

# Was täglich zu teuer wäre: weite Zeitfenster und ein vollständiger
# Neuaufbau. Dabei fällt auf, was der Tageslauf mit seinem engen Fenster
# übersieht — etwa eine Staffel, die vor Wochen anlief, oder ein ADN-Titel,
# der erst in zwei Monaten erscheint.
#
# Außerdem der Ort für den Bericht: Was hat Anime2You gemeldet, das noch nicht
# in `data/curated/` steht? Der landet in der Zusammenfassung des Laufs.

on:
  schedule:
    # Montags 05:41 UTC — nach dem Tageslauf, vor der Arbeitswoche.
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  tief:
    runs-on: ubuntu-latest
    # Zweck und Ziel gehen an die Statusanzeige mit. Ohne sie steht dort nur
    # der Workflow-Name, und der sagt bei drei Auftrags-Läufen dreimal
    # dasselbe (Daniel, 21.08.2026: „Zweck sollte kurz beschreiben wofür
    # dieser lauf ist"). Der Lauf weiß es, die Anzeige nicht — also liefert
    # er es mit.
    env:
      LAUF_ZWECK: "Wöchentlicher Tiefendurchlauf über alle Quellen von anime-kalender.de"
      LAUF_ZIEL: "ADN-Katalog, Sprechrollen, Crunchyroll-Synchro (250) und aniSearch (60) prüfen"
      LAUF_SCHRITTE: '19'
    steps:
      # Sofort anmelden, noch vor allem anderen.
      #
      # Der Schritt weiter unten braucht das ausgecheckte Skript und läuft
      # deshalb erst nach Checkout und npm-Einrichtung — das sind dreißig bis
      # sechzig Sekunden, in denen die Statusanzeige nichts weiß. Daniel am
      # 21.08.2026: „der läuft sogar schon seit 1min aber ist erst jetzt in
      # der app aufgetaucht."
      #
      # Ein curl braucht nichts als das Token. Schlägt er fehl, läuft der Job
      # weiter — die spätere Anmeldung holt es nach.
      - name: Sofort anmelden
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: |
          if [ -z "$LAUF_TOKEN" ]; then exit 0; fi
          printf '{"lauf_id":"%s","repo":"%s","workflow":"%s","zustand":"laeuft","url":"%s","notiz":"wird eingerichtet"}' \
            "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/anmeldung.json
          curl -sS --max-time 10 -X POST "https://newsletter.animekalender.workers.dev/lauf" \
            -H "Content-Type: application/json" -H "X-Lauf-Token: $LAUF_TOKEN" \
            --data-binary @/tmp/anmeldung.json > /dev/null || true


      - uses: actions/checkout@v4
        with:
          # Siehe refresh-hourly.yml: ohne `ref` checkt ein eingereihter Lauf
          # den Stand von vor seiner Wartezeit aus und scheitert am Push.
          ref: main

      # Meldet der Statusanzeige, dass hier etwas läuft. Ohne LAUF_TOKEN
      # passiert nichts — eine fehlende Meldung darf keinen Lauf rot machen.
      # Das Meldeskript an einen Ort legen, den kein Zweigwechsel wegnimmt.
      #
      # Am 21.08.2026 hat ein Auftrags-Lauf seinen eigenen Zweig angelegt und
      # ist dorthin gewechselt — auf dem gab es `tools/lauf-melden.sh` noch
      # nicht. Die Abmeldung scheiterte mit Exit 127 und machte einen Lauf rot,
      # dessen Arbeit fertig und richtig war.
      - name: Melder bereitlegen
        run: |
          cp tools/lauf-melden.sh "$RUNNER_TEMP/lauf-melden.sh"
          echo "MELDER=$RUNNER_TEMP/lauf-melden.sh" >> "$GITHUB_ENV"

      - name: Lauf anmelden
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" laeuft

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cache für die stündliche Aktion mitfüllen — die kann sich `data:fetch`
      # sonst nicht sparen.
      - name: AniList-Cache ablegen
        uses: actions/cache@v4
        with:
          path: data/cache
          key: anilist-cache-${{ github.run_id }}
          restore-keys: anilist-cache-

      - name: Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Rohdaten holen
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run data:fetch

      # Deutsche Anime-Kinostarts bei TMDB.
      #
      # Wöchentlich, nicht täglich: Ein Kinostart wird Monate im Voraus
      # angekündigt und ändert sich selten. Der Lauf schreibt Vorschläge nach
      # data/tmdb-kino.json, keinen Kalendereintrag — die Sprachfassung liefert
      # TMDB nicht, und ohne sie ist ein Anime-Kinotermin nur die halbe Auskunft.
      - name: Deutsche Anime-Kinostarts bei TMDB
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run data:tmdb-kino

      - name: Fortschritt — Rohdaten holen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Rohdaten holen"

      # Der Gesamtkatalog von AniList — die Grundlage für die Titel **ohne**
      # deutsche Synchro. Wöchentlich reicht: Neue Anime tauchen langsam auf,
      # und der Lauf kostet rund 600 Abfragen. Er setzt auf dem Cache auf und
      # holt nur das laufende Jahr sowie Fehlendes nach.
      #
      # `continue-on-error`, weil ein Ausfall hier nichts kaputt macht: Ohne
      # frischen Katalog bleibt die zuletzt gebaute `ohne-synchro.json`
      # unangetastet stehen — sie ist committet.
      - name: AniList-Gesamtkatalog
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:katalog

      - name: Fortschritt — AniList-Gesamtkatalog
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "AniList-Gesamtkatalog"

      - name: Crunchyroll — zwölf Wochen
        continue-on-error: true
        run: npx tsx pipeline/scrape-crunchyroll.ts --weeks 12

      - name: Fortschritt — Crunchyroll — zwölf Wochen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Crunchyroll — zwölf Wochen"

      - name: ADN — ein halbes Jahr voraus
        continue-on-error: true
        run: npx tsx pipeline/fetch-adn.ts --from -90 --to 180

      - name: Fortschritt — ADN — ein halbes Jahr voraus
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "ADN — ein halbes Jahr voraus"

      - name: ADN — vollständiger Katalog
        # Der Kalender zeigt nur, was neu erscheint. Eine Serie, die komplett
        # im Angebot liegt, taucht dort nie auf und fehlte deshalb dauerhaft.
        # Rund 580 Abfragen — zu viel für den Tageslauf, richtig für diesen.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:adn:catalog

      - name: Fortschritt — ADN — vollständiger Katalog
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "ADN — vollständiger Katalog"

      - name: Deutsche Synchronsprecher
        # Holt nur, was fehlt oder älter als ein halbes Jahr ist.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:voices -- --limit 400

      - name: Fortschritt — Deutsche Synchronsprecher
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Deutsche Synchronsprecher"

      - name: Zuordnung zu Anime News Network
        # Der Offline-Datensatz von manami-project wird woechentlich neu gebaut.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:ann:ids

      - name: Fortschritt — Zuordnung zu Anime News Network
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Zuordnung zu Anime News Network"

      - name: Deutsche Sprechrollen von Anime News Network
        # Eine Anfrage pro Sekunde, wie ANN es vorschreibt. Geholt wird nur, was
        # noch nicht im Archiv liegt — nach dem ersten vollen Lauf sind das
        # wenige Titel je Woche.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:ann:voices

      - name: Fortschritt — Deutsche Sprechrollen von Anime News Network
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Deutsche Sprechrollen von Anime News Network"

      - name: Crunchyroll-Serienseiten auf deutsche Tonspur
        # Wiedervorlage nach 28 Tagen. Der Deckel von 250 stammte aus der Zeit
        # der Seitenanzeige, als eine Serie 17 bis 23 Sekunden kostete — über
        # die Content-API sind es 3 bis 5. Er bleibt trotzdem, nur höher:
        # Crunchyroll sperrt nach rund 300 Serien für eine Viertelstunde
        # (gemessen im Lauf vom 21.08.2026, bei 250 ms Pause nach 25 Minuten
        # HTTP 403). Bei 400 ms Pause liefen 409 Adressen am Stück durch.
        #
        # 300 je Woche gegen 911 Adressen und 28 Tage Wiedervorlage: Das trägt
        # den Bestand und lässt Luft, wenn ein Lauf ausfällt.
        continue-on-error: true
        env:
          # Ohne das Paket bricht der Lauf ab, statt still den US-Katalog zu
          # lesen. Es gilt 24 Stunden — ein Lauf braucht also ein frisches.
          CR_ZUGANG: ${{ secrets.CR_ZUGANG }}
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:cr-dub -- --limit 300

      - name: Fortschritt — Crunchyroll-Serienseiten auf deutsche Tonspur
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Crunchyroll-Serienseiten auf deutsche Tonspur"

      - name: YouTube-Verweise auf Abrufbarkeit in Deutschland
        # Die offizielle Data API v3: Sie nennt die Laendersperre als
        # regionRestriction ausdruecklich, im Seitenquelltext steht sie nicht.
        #
        # Rund 1.100 Einheiten je vollem Durchgang, das Tageskontingent sind
        # 10.000. Wiedervorlage nach 30 Tagen, denn Lizenzen kehren zurueck.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run data:youtube

      - name: Fortschritt — YouTube-Verweise auf Abrufbarkeit in Deutschland
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "YouTube-Verweise auf Abrufbarkeit in Deutschland"

      - name: YouTube-Verweise auf Titel, Kanal und Kaufangebot
        # Der zweite Lauf, andere Frage, andere Quelle: oEmbed nennt Titel und
        # Kanal ohne Schluessel und ohne Kontingent, die Videoseite die Tonspur
        # und -- ueber die offerId -- ein Kaufangebot.
        #
        # Er stand vom 23. bis 24.08.2026 unter dem Skriptnamen des Laufs
        # darueber und hat ihn dabei verdraengt: Der Schritt hiess
        # "Abrufbarkeit", startete aber diesen hier, und data/youtube-check.json
        # fror auf dem Stand vom 20.08. ein. Beide haben jetzt einen eigenen
        # Namen, und beide laufen.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:youtube:titel && npm run data:youtube:report

      - name: Fortschritt — YouTube-Verweise auf Titel, Kanal und Kaufangebot
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "YouTube-Verweise auf Titel, Kanal und Kaufangebot"

      - name: Anbieter-Verweise auf tote Seiten prüfen
        # Eine Stichprobe am 20.08.2026 fand bei Joyn 9 von 11 und bei Aniverse
        # 9 von 30 Verweisen mit 404 — ein Versprechen auf eine Fehlerseite.
        #
        # Crunchyroll und ADN bleiben absichtlich außen vor: Sie antworten jedem
        # Skript mit 403, das wäre kein Befund. Entfernt wird ohnehin nur bei
        # einem harten 404; Zeitüberschreitung und 403 ändern nichts.
        #
        # Gedeckelt, damit nicht jede Woche 945 fremde Seiten auf einmal
        # abgeklopft werden. Wiedervorlage nach 30 Tagen.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:links -- --limit 400

      - name: Fortschritt — Anbieter-Verweise auf tote Seiten prüfen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Anbieter-Verweise auf tote Seiten prüfen"

      - name: Anime2You
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:anime2you

      - name: Fortschritt — Anime2You
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Anime2You"

      - name: Deutsche Texte und Anbieter von aniSearch
        # Nur ein Kontingent je Lauf, eine Anfrage pro Sekunde. Der Bestand
        # füllt sich über die Tage; er liegt im Repo und geht nie verloren.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:anisearch -- --limit 60

      - name: Fortschritt — Deutsche Texte und Anbieter von aniSearch
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Deutsche Texte und Anbieter von aniSearch"

      # TMDB: deutsche Handlung, FSK und Anbieter je Titel.
      #
      # Stand bis zum 21.08.2026 lief dieser Abruf in **keinem** Workflow — er
      # war einmal von Hand gestartet worden und veraltete danach still. Genau
      # der Fall, den die `CLAUDE.md` als „ein neuer Abruf braucht drei Dinge"
      # beschreibt.
      #
      # 400 je Woche bei 2.761 Titeln und 60 Tagen Wiedervorlage: Ein voller
      # Durchgang dauert damit sieben Wochen — zu wenig. Der Deckel schützt die
      # Laufzeit dieses Workflows; wird der Rückstand zu groß, holt ihn ein
      # Lauf von Hand mit höherem `--limit` auf.
      - name: TMDB-Angaben auffrischen
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:tmdb -- --limit 400

      - name: Fortschritt — TMDB-Angaben auffrischen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "TMDB-Angaben auffrischen"

      - name: Datensatz bauen
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run data:build

      - name: Fortschritt — Datensatz bauen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Datensatz bauen"

      - name: Vorschaubilder
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:og

      - name: Fortschritt — Vorschaubilder
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Vorschaubilder"

      - name: Änderungen committen
        # `always()`, damit ein gescheiterter Aufbau nicht die Ernte mitnimmt.
        #
        # Dieser Lauf befragt fünf fremde Server mit Ratenlimits und braucht dafür
        # eine knappe Stunde. Am 17.08.2026 brach der Build am Ende ab (zwei
        # ADN-Kennungen auf einem Anime), der Commit-Schritt lief nie, und die
        # gesamte Ernte ging mit dem Runner unter — dreimal in Folge, jedes Mal
        # dieselbe Last auf denselben fremden Servern.
        #
        # Der Job bleibt trotzdem rot, wenn der Aufbau scheitert: Die Fehlermail
        # soll kommen. Nur die Quellen sollen sie überleben.
        if: always()
        run: |
          bash tools/commit-data.sh "chore(data): wöchentlicher Tiefendurchlauf"

      - name: Was noch kuratiert werden müsste
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:report >> $GITHUB_STEP_SUMMARY

      - name: Fortschritt — Was noch kuratiert werden müsste
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Was noch kuratiert werden müsste"

      - name: Quellen auf Schweigen prüfen
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:check

      - name: Fortschritt — Quellen auf Schweigen prüfen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Quellen auf Schweigen prüfen"

      - name: Ergebnis nach Discord melden
        # Immer, auch bei einem Fehlschlag — eine Meldung, die genau dann
        # ausbleibt, wenn etwas kaputt ist, wäre die falsche herum.
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: bash tools/discord-melden.sh "Wöchentlicher Tiefendurchlauf" "${{ job.status }}"

      # Läuft auch nach einem Fehler: Der rote Lauf ist der, den man sehen will.
      - name: Lauf abmelden
        continue-on-error: true
        if: always()
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" "${{ job.status == 'success' && 'ok' || job.status == 'cancelled' && 'abgebrochen' || 'fehler' }}"
