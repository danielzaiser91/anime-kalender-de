name: PR-Prüfer — Neustart bei Nachtrag

# Ein Kommentar „Nachtrag…“/„Nachbesserung…“ eines Berechtigten auf einem offenen PR startet den CI-Prüfer (pr-pruefer.yml)
# für den aktuellen Kopf neu; ein laufender Prüfer-Lauf wird vorher abgebrochen. Vorher musste der Bauer
# `gh run rerun` von Hand anstoßen (Fälle 1585 R2, 2284, 2289: Prüfer urteilte ohne Nachtrag).
# pr-pruefer.yml selbst bleibt unverändert; die Entscheidung trifft tools/pr-pruefer-neustart.mjs (Skript aus main).
# `issue_comment` läuft mit Repo-Rechten in der Fassung von main: der Kommentartext geht nur über `env`, nie in `run:`,
# und es wird kein PR-Code ausgeführt oder ausgecheckt.

# Zweiter Auslöser (`workflow_run`): Endet die PR-Prüfkette eines Kopfes, dessen letztes Prüfer-Urteil „nicht beurteilt, Kette lief noch“
# lautete (Marke im Kommentar, gesetzt in pr-pruefer.yml), startet tools/pr-pruefer-nach-kette.mjs den Prüfer neu. Ohne PR-Code, ohne Kommentartext.

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ['PR-Prüfkette']
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  # actions: write nur für `gh run cancel` und `gh run rerun` des Prüfer-Laufs.
  actions: write

# Ein Neustart je PR (Nachtrag) bzw. je Kopf (Kettenende) zur Zeit; ein wartender wird vom neueren ersetzt (der neue liest ohnehin alle Kommentare).
# Ein abgebrochenes Kettenende (cancelled) hat eine eigene Gruppe: sein Lauf tut nichts (Job übersprungen) und darf darum keinen
# wartenden Neustart desselben Kopfes verdrängen (Kette erneut gestartet, Ende success wartet, cancelled-Ereignis käme als Neueres).
concurrency:
  group: pr-pruefer-nachtrag-${{ github.event.issue.number || github.event.workflow_run.head_sha }}${{ github.event.workflow_run.conclusion == 'cancelled' && '-abgebrochen' || '' }}
  cancel-in-progress: false

jobs:
  neustart:
    name: Prüfer neu starten
    # Kommentare auf Issues und die des Prüfers selbst starten nichts (keine Schleife).
    if: github.event.issue.pull_request != null && github.event.comment.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prüfer neu starten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMMER: ${{ github.event.issue.number }}
          KOMMENTAR: ${{ github.event.comment.body }}
          KOMMENTAR_LOGIN: ${{ github.event.comment.user.login }}
          KOMMENTAR_ASSOZIATION: ${{ github.event.comment.author_association }}
          KOMMENTAR_ZEIT: ${{ github.event.comment.created_at }}
        run: node tools/pr-pruefer-neustart.mjs

  nach-kette:
    name: Prüfer nach Kettenende neu starten
    # Eine abgebrochene Kette (cancelled) startet nichts: Ein neuerer Kopf hat seine eigene Kette und sein eigenes Ende; wurde sie von Hand
    # ohne Nachfolger abgebrochen, steht nichts zu beurteilen an, und der nächste Kettenlauf desselben Kopfes endet wieder hier (success/failure).
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    # Wartet bis 28 min auf das Ende des Prüfer-Laufs (sein Kommentar entsteht erst am Schluss; er hat 30 min Frist und liest
    # das Kettenlog nach ~13 min), dann Abruf und Neustart. Ein Lauf je Kopf (Gruppe), der Runner schläft nur.
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prüfer nach Kettenende neu starten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOPF_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node tools/pr-pruefer-nach-kette.mjs
