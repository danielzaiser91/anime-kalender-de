name: Täglich — alle Quellen

# **Dieser Lauf sammelt und reicht ein — er baut nicht und schreibt nicht auf `main`.** Der Fund geht als Pull Request auf einen eigenen Zweig
# (`tools/quellen-pr.sh`) und wird gemergt, wenn GitHub `MERGEABLE` sagt; sonst übernimmt „Claude — Daten-PR zusammenführen". Den Datensatz baut „Bestand —
# zusammenführen und bauen"; dass eine Quelle schweigt, meldet dort `data:check` (Daniel, 30.08.2026: „wöchentlich und stündlich sollte nie rot sein können").
#
# Der große tägliche Lauf: Metadaten, Synchro-Listen, ADN-Kalender, Nachrichtenlage. Die stündliche Aktion deckt nur Crunchyroll ab.
#
# Umbau vom 05.10.2026: eigene Gruppe `tag` (vorher `daten`), zwei Jobs — `sammeln` und `anisearch` (Sperre `anisearch`: der Sechs-Sekunden-Takt ist eine Zusage, nie zwei
# Läufe zugleich bei aniSearch) —, Schritte über `tools/schritt.sh` (Zeitgrenze, sichtbares Scheitern, gelbe Meldung statt stillem Haken). Der aniSearch-Schritt stand
# doppelt darin (200 und 120 Seiten, der zweite unter dem Kommentar zur Erweiterungs-Abholung); die Warteschlange ist nach den ersten 200 meist leer, den Großteil holt
# `anisearch-katalog.yml`. Jetzt ein Schritt mit 200.

on:
  # Zeitplan: Cloudflare-Wecker (`worker/src/wecker.ts`) startet diesen Lauf per workflow_dispatch um 04:00 UTC. GitHubs eigener Cron kam
  # gemessen 4–7 Stunden zu spät und würde Läufe verdoppeln; `wecker-wache.yml` holt Überfälliges nach, falls der Wecker ausfällt (05.10.2026).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tag
  cancel-in-progress: false

env:
  LAUF_ZWECK: 'Aktualisiert täglich alle Datenquellen von anime-kalender.de'
  LAUF_ZIEL: 'AniList, Crunchyroll, ADN, Anime2You und aniSearch einlesen'
  LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}

jobs:
  # Sofort anmelden, noch vor Checkout und Einrichtung (30–60 Sekunden, in denen die Statusanzeige sonst nichts weiß; Daniel, 21.08.2026).
  anmelden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lauf anmelden
        continue-on-error: true
        run: |
          if [ -z "$LAUF_TOKEN" ]; then exit 0; fi
          printf '{"lauf_id":"%s","repo":"%s","workflow":"%s","zweck":"%s","ziel":"%s","zustand":"laeuft","url":"%s","notiz":"zwei Jobs: Quellen und aniSearch"}' \
            "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" "$LAUF_ZWECK" "$LAUF_ZIEL" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/anmeldung.json
          curl -sS --max-time 10 -X POST "https://newsletter.animekalender.workers.dev/lauf" \
            -H "Content-Type: application/json" -H "X-Lauf-Token: $LAUF_TOKEN" \
            --data-binary @/tmp/anmeldung.json > /dev/null || true

  sammeln:
    needs: anmelden
    runs-on: ubuntu-latest
    # Gemessen 13 bis 22 Minuten ohne aniSearch; 60 sind reichlich. Läuft es darüber hinaus, ist der nächste Lauf der bessere Weg — die Abrufe sind idempotent.
    timeout-minutes: 60
    outputs:
      fehler: ${{ steps.auswerten.outputs.fehler }}
    env:
      JOB_ANZEIGE: Quellen
    steps:
      # Ohne `ref` holte checkout den Commit des Auslösers — bei einem eingereihten Lauf den Stand von vor der Wartezeit (so am 09.08.2026).
      - uses: actions/checkout@v4
        with:
          ref: main
      # Der Tageslauf holt die Rohdaten frisch und legt den AniList-Cache für Stunden- und Bauläufe unter eigenem Schlüssel ab.
      - uses: ./.github/actions/einrichten
        with:
          cache: save
          playwright: 'true'

      - name: Rohdaten holen
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: bash tools/schritt.sh --zeit 25m "Rohdaten holen" -- npm run data:fetch

      # Schlägt der Lauf fehl (Seitenumbau, Ausfall), bleiben die zuletzt gespeicherten Zeiten stehen — der Build läuft trotzdem weiter.
      - name: Deutsche Sendezeiten von Crunchyroll lesen
        run: bash tools/schritt.sh --zeit 10m "Sendezeiten von Crunchyroll" -- npm run data:crunchyroll

      # Vier Abrufe, wenige Sekunden: Crunchyroll führt selbst, was neu hinzugekommen ist, und nennt je Folge ihre Tonspur. Ohne diesen Lauf erfahren wir von einer
      # neuen Synchro erst bei der nächsten Wiedervorlage (Lord-of-Mysteries-Specials: vier Wochen, 10.09.2026).
      - name: Neue deutsche Folgen bei Crunchyroll finden
        run: bash tools/schritt.sh --zeit 8m "Neue Folgen bei Crunchyroll" -- npm run data:cr-neu

      # Je Artikel, der einen Termin belegt: Text-Hash, Veröffentlicht/Aktualisiert und ein Bild in der privaten R2-Ablage des Workers (/beleg). Höchstens 25 je
      # Lauf, jeder Artikel alle 7 Tage; nach drei Störungen in Folge endet der Schritt.
      - name: Belege lesen (Hash, Datum, privates Bild)
        run: bash tools/schritt.sh --zeit 25m "Belege lesen" -- npx tsx pipeline/belege-lesen.ts

      # Frisches Zugangspaket über die Vercel-Weiche in Frankfurt (weiche-vercel/, 16.09.2026); das Secret CR_ZUGANG bleibt nur Rückfall, es lebt 24 Stunden.
      - name: Crunchyroll-Zugangspaket über die Weiche holen
        env:
          CR_WEICHE_TOKEN: ${{ secrets.CR_WEICHE_TOKEN }}
        run: bash tools/schritt.sh --zeit 5m "Zugangspaket holen" -- node tools/cr-zugang-holen.mjs --github-env

      # Der Fund allein ändert den Datensatz nicht — er hebt nur die Wiedervorlage auf. `--nur-neu` beschränkt den Lauf auf die Serien aus dem Fund (12.09.2026: zwanzig
      # statt rund elfhundert). Ohne gültiges Zugangspaket bricht er ab, und das ist Absicht: ein Lauf, der unbemerkt den US-Katalog liest, ist schlimmer als keiner.
      # Die Signatur gilt 24 Stunden und entsteht nur an einer deutschen Leitung; die Meldung sagt, wenn genau das passiert ist (Lehre 06.09.2026).
      - name: Die neu gefundenen Serien sofort beurteilen
        env:
          CR_ZUGANG: ${{ env.CR_ZUGANG_FRISCH || secrets.CR_ZUGANG }}
        run: >
          bash tools/schritt.sh --zeit 25m "Neue Serien beurteilen" -- bash -c
          'npm run data:cr-dub -- --nur-neu --limit 60 || { bash "$MELDER" fehler "Crunchyroll-Urteil übersprungen: CR_ZUGANG fehlt oder ist abgelaufen — node tools/cr-zugang-holen.mjs --secret"; exit 1; }'

      # Liefert Datum, Uhrzeit UND Sprachfassung — die einzige Quelle neben Crunchyroll, die die Synchro selbst ausweist.
      - name: ADN-Kalender lesen
        run: bash tools/schritt.sh --zeit 12m "ADN-Kalender" -- npm run data:adn

      # Der Monatslauf (tonspuren-monatlich.yml) holt den Bestand; dieser hier nur die Änderungen der letzten Tage (Daniel, 23.08.2026: „nicht erst tage später").
      - name: Was bei Netflix, Prime und Disney+ neu ist
        env:
          STREAMING_API_KEY: ${{ secrets.STREAMING_API_KEY }}
        run: bash tools/schritt.sh --zeit 10m "Neu bei Netflix, Prime, Disney+" -- npm run data:motn:changes -- --tage 3 --budget 4

      # Die Anbieter-Deep-Links aus dem Archiv, ohne Netzzugriff: Prime-Video-Verweise stehen sonst als Suche da (amazon.de sperrt ClaudeBot namentlich).
      - name: Anbieter-Links aus dem MOTN-Archiv
        run: bash tools/schritt.sh --zeit 5m "Anbieter-Links aus dem MOTN-Archiv" -- npm run data:motn-links

      # Je TOGGO-Weg die Folgen mit ihrem freien Fenster. Ein Abruf je Serie, 1,5 s Abstand.
      - name: TOGGO — welche Folgen gerade abrufbar sind
        run: bash tools/schritt.sh --zeit 10m "TOGGO" -- npm run data:toggo

      # Das TV-Programm nennt nur Folgentitel; die Episodenlisten der de.wikipedia die Nummer dazu (über /wiki/…?action=raw, robots.txt sperrt /w/; 1 s Abstand).
      - name: Wikipedia — Folgennummern für das TV-Programm
        run: bash tools/schritt.sh --zeit 10m "Wikipedia-Folgennummern" -- npm run data:wikipedia-folgen

      # Erzeugt nur Vorschläge für die Kuratierung, keine Termine.
      - name: Nachrichtenlage bei Anime2You prüfen
        run: bash tools/schritt.sh --zeit 12m "Anime2You" -- npm run data:anime2you

      # Der Abruf darüber holt die Meldungen, dieser Schritt macht sie sichtbar: `15-news-vorschau.md` listet jede Ankündigung mit künftigem Termin, die noch nicht im
      # Datensatz steht (bis 07.09.2026 lief `data:report` in keinem Workflow; bei „Kill Blue" lag die Ankündigung vier Tage vor dem Termin ungesehen im Repo).
      - name: Was angekündigt ist und noch fehlt
        run: bash tools/schritt.sh --zeit 5m "Was angekündigt ist und noch fehlt" -- bash -c 'npm run data:report >> "$GITHUB_STEP_SUMMARY"'

      # Westliche Animationsserien: nur, was älter als 21 Tage ist — im Normalfall wenige Dutzend Abrufe.
      - name: Westliche Animationsserien
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: bash tools/schritt.sh --zeit 15m "Westliche Animationsserien" -- npm run data:cartoons

      # Deutsche Trailer zu Anime-Filmen (KinoChecks API und der Index seines Kanals); täglich, weil ein Trailer vor dem Kinostart erscheint.
      # TMDB_API_KEY fehlte bis 19.09.2026: Weg 3 (TMDBs Videoliste) lief in der Cloud nie.
      - name: Deutsche Trailer zu Anime-Filmen
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: bash tools/schritt.sh --zeit 20m "Deutsche Trailer" -- npm run data:trailer

      # YouTube-Kaufangebote für Filme, die TMDB nur „über TMDB" kennt (22.09.2026). 30 Suchen = 3.000 der 10.000 Tageseinheiten.
      - name: YouTube-Kaufangebote direkt verlinken
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: bash tools/schritt.sh --zeit 10m "YouTube-Kaufangebote" -- npm run data:youtube:kauf -- --limit 30

      - name: Quellen als Pull Request einreichen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/quellen-pr.sh "chore(data): Tagesquellen gesammelt"

      - name: Fehlschläge auswerten
        id: auswerten
        if: always()
        run: bash tools/schritte-auswerten.sh

  # --- aniSearch: ein Server, sechs Sekunden je Seite — eigene Sperre, gemeinsam mit Katalog und Wochenlauf -------------
  anisearch:
    needs: anmelden
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: anisearch
      cancel-in-progress: false
    outputs:
      fehler: ${{ steps.auswerten.outputs.fehler }}
    env:
      JOB_ANZEIGE: aniSearch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/einrichten
        with:
          cache: 'aus'

      # 200 Titel im Sechs-Sekunden-Takt (Kontingent und Takt stehen im Skript). Der Bestand liegt im Repo und geht nicht verloren. Vom 09. bis 10.08.2026 ausgesetzt:
      # anisearch.de war vom Anschluss des Betreibers aus nicht erreichbar; die Sperre verschwand von selbst.
      - name: Deutsche Texte und Anbieter von aniSearch
        run: bash tools/schritt.sh --zeit 50m "aniSearch — Texte und Anbieter" -- npm run data:anisearch

      # Deutsche Disc-Ausgaben aus dem aniSearch-Archiv — kein Abruf, nur das Auswerten dessen, was der Schritt davor ablegt. Muss vor dem Bau laufen: Er macht daraus
      # die Bezugswege für Titel, die sonst keinen einzigen zeigen (176 am 29.08.2026).
      - name: Deutsche Disc-Ausgaben aus dem Archiv
        run: bash tools/schritt.sh --zeit 10m "Disc-Ausgaben" -- npm run data:disc-ausgaben

      - name: Quellen als Pull Request einreichen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/quellen-pr.sh "chore(data): aniSearch-Tagesquellen gesammelt"

      - name: Fehlschläge auswerten
        id: auswerten
        if: always()
        run: bash tools/schritte-auswerten.sh

  # --- Abschluss: Statusanzeige und Discord -----------------------------------------------------------------------------
  abschluss:
    needs: [anmelden, sammeln, anisearch]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tools
      - name: Zustand bestimmen und melden
        env:
          ERGEBNISSE: ${{ join(needs.*.result, ' ') }}
          FEHLER: ${{ needs.sammeln.outputs.fehler }} ${{ needs.anisearch.outputs.fehler }}
        run: |
          status=success
          if printf '%s' "$ERGEBNISSE" | grep -q failure; then status=failure
          elif printf '%s' "$ERGEBNISSE" | grep -q cancelled; then status=cancelled; fi
          echo "STATUS=$status" >> "$GITHUB_ENV"
          bash tools/lauf-abmelden.sh "$status" "$FEHLER"
      # Nur bei einem Fehlschlag: Dieser Lauf läuft täglich, eine Erfolgsmeldung wäre Lärm in einem Kanal, den auch andere lesen.
      - name: Ergebnis nach Discord melden
        if: env.STATUS == 'failure'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: bash tools/discord-melden.sh "Täglicher Datenlauf" "failure"
