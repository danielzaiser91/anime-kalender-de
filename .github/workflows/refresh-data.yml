name: Täglich — alle Quellen

# Der große Lauf: Metadaten, Synchro-Listen, ADN-Kalender, Nachrichtenlage.
# Die stündliche Aktion deckt nur Crunchyroll ab.

on:
  schedule:
    # 04:17 UTC — abseits der vollen Stunde, damit die Fremd-APIs nicht
    # gleichzeitig von tausend Cron-Jobs getroffen werden.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Siehe refresh-hourly.yml: ohne `ref` checkt ein eingereihter Lauf
          # den Stand von vor seiner Wartezeit aus und scheitert am Push.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cache für die stündliche Aktion mitfüllen — die kann sich `data:fetch`
      # sonst nicht sparen.
      - name: AniList-Cache ablegen
        uses: actions/cache@v4
        with:
          path: data/cache
          key: anilist-cache-${{ github.run_id }}
          restore-keys: anilist-cache-

      - name: Browser für den Crunchyroll-Kalender installieren
        run: npx playwright install --with-deps chromium

      - name: Rohdaten holen
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run data:fetch

      - name: Deutsche Sendezeiten von Crunchyroll lesen
        # Schlägt der Lauf fehl (Seitenumbau, Ausfall), bleiben die zuletzt
        # gespeicherten Zeiten stehen — der Build läuft trotzdem weiter.
        continue-on-error: true
        run: npm run data:crunchyroll

      - name: ADN-Kalender lesen
        # Liefert Datum, Uhrzeit UND Sprachfassung — die einzige Quelle neben
        # Crunchyroll, die die Synchro selbst ausweist.
        continue-on-error: true
        run: npm run data:adn

      - name: Nachrichtenlage bei Anime2You prüfen
        # Erzeugt nur Vorschläge für die Kuratierung, keine Termine.
        continue-on-error: true
        run: npm run data:anime2you

      - name: Deutsche Texte und Anbieter von aniSearch
        # AUSGESETZT seit 09.08.2026. Kurz nach dem ersten sauberen Lauf war
        # anisearch.de vom Anschluss des Betreibers aus wieder nicht erreichbar
        # (TCP 443 tot, IPv4 und IPv6). Ob das mit diesem Lauf zusammenhängt,
        # ist offen. Solange es offen ist, schicken wir keine 200 Anfragen pro
        # Nacht an eine Seite, die uns möglicherweise gerade nicht haben will.
        # Eine Anfrage nach einem regulären Zugang liegt bei api@anisearch.com;
        # sobald die Antwort da ist, `if:` wieder entfernen.
        #
        # Kontingent und Takt stehen im Skript (200 Titel, alle sechs Sekunden).
        # Der Bestand liegt im Repo und geht nicht verloren: 1.160 von 2.612
        # Seiten sind geholt.
        if: false
        continue-on-error: true
        run: npm run data:anisearch

      - name: Datensatz bauen
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run data:build

      - name: Vorschaubilder für neue Releases erzeugen
        run: npm run data:og

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/og data/curated-ids.json data/tmdb.json \
                  data/crunchyroll.json data/adn.json data/anisearch.json data/anime-ids.json \
                  data/proposals data/source-health.json
          if git diff --staged --quiet; then
            echo "Keine Datenänderung."
          else
            git commit -m "chore(data): Datensatz automatisch aktualisiert"
            git pull --rebase --autostash
            git push
          fi

      # Zuletzt, damit der Datenstand auch dann committet ist, wenn die Prüfung
      # anschlägt. Ein roter Lauf schickt dem Betreiber eine Mail — das ist die
      # Meldung „eine Quelle ist stumm geworden", ohne eigene Infrastruktur.
      - name: Quellen auf Schweigen prüfen
        run: npm run data:check
