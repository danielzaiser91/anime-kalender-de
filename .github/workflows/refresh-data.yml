name: Daten aktualisieren

on:
  schedule:
    # 04:17 UTC — abseits der vollen Stunde, damit die Fremd-APIs nicht
    # gleichzeitig von tausend Cron-Jobs getroffen werden.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Browser für den Crunchyroll-Kalender installieren
        run: npx playwright install --with-deps chromium

      - name: Rohdaten holen
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run data:fetch

      - name: Deutsche Sendezeiten von Crunchyroll lesen
        # Schlägt der Lauf fehl (Seitenumbau, Ausfall), bleiben die zuletzt
        # gespeicherten Zeiten stehen — der Build läuft trotzdem weiter.
        continue-on-error: true
        run: npm run data:crunchyroll

      - name: Datensatz bauen
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run data:build

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/curated-ids.json data/tmdb.json data/crunchyroll.json
          if git diff --staged --quiet; then
            echo "Keine Datenänderung."
          else
            git commit -m "chore(data): Datensatz automatisch aktualisiert"
            git push
          fi
