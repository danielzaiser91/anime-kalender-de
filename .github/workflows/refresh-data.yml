name: Täglich — alle Quellen

# Der große Lauf: Metadaten, Synchro-Listen, ADN-Kalender, Nachrichtenlage.
# Die stündliche Aktion deckt nur Crunchyroll ab.

on:
  schedule:
    # 04:17 UTC — abseits der vollen Stunde, damit die Fremd-APIs nicht
    # gleichzeitig von tausend Cron-Jobs getroffen werden.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Zweck und Ziel gehen an die Statusanzeige mit. Ohne sie steht dort nur
    # der Workflow-Name, und der sagt bei drei Auftrags-Läufen dreimal
    # dasselbe (Daniel, 21.08.2026: „Zweck sollte kurz beschreiben wofür
    # dieser lauf ist"). Der Lauf weiß es, die Anzeige nicht — also liefert
    # er es mit.
    env:
      LAUF_ZWECK: "Aktualisiert täglich alle Datenquellen von anime-kalender.de"
      LAUF_ZIEL: "AniList, Crunchyroll, ADN, Anime2You und aniSearch einlesen, Datensatz neu bauen"
      LAUF_SCHRITTE: '11'
    steps:
      # Sofort anmelden, noch vor allem anderen.
      #
      # Der Schritt weiter unten braucht das ausgecheckte Skript und läuft
      # deshalb erst nach Checkout und npm-Einrichtung — das sind dreißig bis
      # sechzig Sekunden, in denen die Statusanzeige nichts weiß. Daniel am
      # 21.08.2026: „der läuft sogar schon seit 1min aber ist erst jetzt in
      # der app aufgetaucht."
      #
      # Ein curl braucht nichts als das Token. Schlägt er fehl, läuft der Job
      # weiter — die spätere Anmeldung holt es nach.
      - name: Sofort anmelden
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: |
          if [ -z "$LAUF_TOKEN" ]; then exit 0; fi
          printf '{"lauf_id":"%s","repo":"%s","workflow":"%s","zustand":"laeuft","url":"%s","notiz":"wird eingerichtet"}' \
            "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_WORKFLOW" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/anmeldung.json
          curl -sS --max-time 10 -X POST "https://newsletter.animekalender.workers.dev/lauf" \
            -H "Content-Type: application/json" -H "X-Lauf-Token: $LAUF_TOKEN" \
            --data-binary @/tmp/anmeldung.json > /dev/null || true


      - uses: actions/checkout@v4
        with:
          # Siehe refresh-hourly.yml: ohne `ref` checkt ein eingereihter Lauf
          # den Stand von vor seiner Wartezeit aus und scheitert am Push.
          ref: main

      # Meldet der Statusanzeige, dass hier etwas läuft. Ohne LAUF_TOKEN
      # passiert nichts — eine fehlende Meldung darf keinen Lauf rot machen.
      # Das Meldeskript an einen Ort legen, den kein Zweigwechsel wegnimmt.
      #
      # Am 21.08.2026 hat ein Auftrags-Lauf seinen eigenen Zweig angelegt und
      # ist dorthin gewechselt — auf dem gab es `tools/lauf-melden.sh` noch
      # nicht. Die Abmeldung scheiterte mit Exit 127 und machte einen Lauf rot,
      # dessen Arbeit fertig und richtig war.
      - name: Melder bereitlegen
        run: |
          cp tools/lauf-melden.sh "$RUNNER_TEMP/lauf-melden.sh"
          echo "MELDER=$RUNNER_TEMP/lauf-melden.sh" >> "$GITHUB_ENV"

      - name: Lauf anmelden
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" laeuft

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cache für die stündliche Aktion mitfüllen — die kann sich `data:fetch`
      # sonst nicht sparen.
      - name: AniList-Cache ablegen
        uses: actions/cache@v4
        with:
          path: data/cache
          key: anilist-cache-${{ github.run_id }}
          restore-keys: anilist-cache-

      - name: Browser für den Crunchyroll-Kalender installieren
        run: npx playwright install --with-deps chromium

      - name: Rohdaten holen
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run data:fetch

      - name: Fortschritt — Rohdaten holen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Rohdaten holen"

      - name: Deutsche Sendezeiten von Crunchyroll lesen
        # Schlägt der Lauf fehl (Seitenumbau, Ausfall), bleiben die zuletzt
        # gespeicherten Zeiten stehen — der Build läuft trotzdem weiter.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:crunchyroll

      - name: Fortschritt — Deutsche Sendezeiten von Crunchyroll lesen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Deutsche Sendezeiten von Crunchyroll lesen"

      - name: ADN-Kalender lesen
        # Liefert Datum, Uhrzeit UND Sprachfassung — die einzige Quelle neben
        # Crunchyroll, die die Synchro selbst ausweist.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:adn

      - name: Fortschritt — ADN-Kalender lesen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "ADN-Kalender lesen"

      - name: Was bei Netflix, Prime und Disney+ neu ist
        # Der Monatslauf (tonspuren-monatlich.yml) holt den Bestand; dieser hier
        # nur die Änderungen der letzten Tage. Daniel am 23.08.2026: „nicht erst
        # tage später". Kostet eine Anfrage am Tag statt eines halben
        # Monatskontingents — und liefert die Tonspur gleich mit.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          STREAMING_API_KEY: ${{ secrets.STREAMING_API_KEY }}
        run: npm run data:motn:changes -- --tage 3 --budget 4

      # Die Anbieter-Deep-Links aus dem Archiv einsammeln — ohne Netzzugriff.
      #
      # Die Rohantworten tragen je Anbieter ein `link`-Feld; der Parser hat es
      # nie gelesen. Prime-Video-Verweise stehen bei uns sonst als **Suche**
      # da (aniSearch liefert es so), und selbst nachsehen dürfen wir nicht:
      # amazon.de sperrt ClaudeBot namentlich. Läuft direkt hinter dem Abruf,
      # damit das, was gerade hereinkam, sofort mitzählt.
      - name: Anbieter-Links aus dem MOTN-Archiv
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:motn-links

      - name: Fortschritt — Was bei Netflix, Prime und Disney+ neu ist
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Was bei Netflix, Prime und Disney+ neu ist"

      - name: Nachrichtenlage bei Anime2You prüfen
        # Erzeugt nur Vorschläge für die Kuratierung, keine Termine.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:anime2you

      - name: Fortschritt — Nachrichtenlage bei Anime2You prüfen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Nachrichtenlage bei Anime2You prüfen"

      - name: Deutsche Texte und Anbieter von aniSearch
        # Vom 09. bis 10.08.2026 ausgesetzt: anisearch.de war vom Anschluss des
        # Betreibers aus nicht erreichbar, und ob der Lauf davor das ausgelöst
        # hatte, war offen. Die Sperre ist von selbst verschwunden — ohne dass
        # wir etwas geändert hätten. Das spricht dafür, dass sie eine
        # zeitlich begrenzte Reaktion auf den allerersten Lauf war, der mit 60
        # Anfragen je Minute lief, und nicht auf den sauberen mit 10.
        #
        # Kontingent und Takt stehen im Skript (200 Titel, alle sechs Sekunden).
        # Der Bestand liegt im Repo und geht nicht verloren.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:anisearch

      - name: Fortschritt — Deutsche Texte und Anbieter von aniSearch
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Deutsche Texte und Anbieter von aniSearch"

      # Was über die Browser-Erweiterung gemeldet wurde, liegt im Worker und
      # muss abgeholt werden. Stand bis zum 24.08.2026 in keinem Workflow —
      # die Meldungen warteten, bis jemand den Befehl von Hand ausführte.
      #
      # Vor dem Datenbau, damit heute Gemeldetes heute im Datensatz steht.
      - name: Meldungen aus der Erweiterung abholen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:pruefungen

      - name: Fortschritt — Meldungen abgeholt
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Meldungen aus der Erweiterung abgeholt"

      - name: Datensatz bauen
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run data:build


      # Was dieser Lauf am Bestand veraendert hat, Zeile fuer Zeile.
      # Ohne diese Spur sah ein Lauf, der 508 Meldungen verlor, genauso
      # gruen aus wie einer, der alles eingearbeitet hat (26.08.2026).
      - name: Delta am Bestand festhalten
        continue-on-error: true
        run: npm run data:historie -- --lauf "${{ github.workflow }}"
      - name: Fortschritt — Datensatz bauen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Datensatz bauen"

      # Die Listen, mit denen Daniel und die Erweiterung arbeiten — sie
      # entstehen aus dem frisch gebauten Datensatz und müssen deshalb hier
      # stehen, nicht davor.
      #
      # **Sie liefen bis zum 25.08.2026 in keinem Workflow.** Erzeugt wurden sie
      # einmal von Hand am 23.08., und seither veralteten sie still: Die
      # Erweiterung zeigte 384 offene Prime-Titel, obwohl längst gemeldet war,
      # und bot dieselben Titel wieder und wieder zum Melden an (Daniel,
      # 25.08.2026: „warum sind es immer noch 384 titel, warum kann ich die
      # bereits gemeldeten erneut melden?").
      #
      # Genau der Fall, den `CLAUDE.md` unter „Ein neuer Abruf braucht drei
      # Dinge" beschreibt — nur ging es hier nicht um einen Abruf, sondern um
      # ein Erzeugnis. Die Regel gilt für beides.
      - name: Arbeitslisten und Erweiterungs-Liste neu erzeugen
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:dub-checks && npm run data:extension-liste

      - name: Fortschritt — Arbeitslisten neu erzeugen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Arbeitslisten neu erzeugen"

      - name: Vorschaubilder für neue Releases erzeugen
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:og

      - name: Fortschritt — Vorschaubilder für neue Releases erzeugen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Vorschaubilder für neue Releases erzeugen"

      - name: Änderungen committen
        # `always()`, aus demselben Grund wie im Wochenlauf: Bricht der Aufbau an
        # einem Widerspruch ab, sind die Quellen dieses Laufs das Einzige, was
        # ihn reparieren kann — und aniSearch gibt eine Seite pro Sekunde her.
        # Der Job bleibt rot, die Ernte bleibt da.
        if: always()
        run: |
          bash tools/commit-data.sh "chore(data): Datensatz automatisch aktualisiert"

      # Zuletzt, damit der Datenstand auch dann committet ist, wenn die Prüfung
      # anschlägt. Ein roter Lauf schickt dem Betreiber eine Mail — das ist die
      # Meldung „eine Quelle ist stumm geworden", ohne eigene Infrastruktur.
      - name: Quellen auf Schweigen prüfen
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:check

      - name: Fortschritt — Quellen auf Schweigen prüfen
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" schritt "Quellen auf Schweigen prüfen"

      - name: Ergebnis nach Discord melden
        # Nur bei einem Fehlschlag. Dieser Lauf läuft täglich beziehungsweise
        # stündlich; eine Erfolgsmeldung wäre Lärm in einem Kanal, den auch
        # andere lesen.
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: bash tools/discord-melden.sh "Täglicher Datenlauf" "${{ job.status }}"

      # Läuft auch nach einem Fehler: Der rote Lauf ist der, den man sehen will.
      - name: Lauf abmelden
        continue-on-error: true
        if: always()
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" "${{ job.status == 'success' && 'ok' || job.status == 'cancelled' && 'abgebrochen' || 'fehler' }}"
