name: Täglich — alle Quellen

# Der große Lauf: Metadaten, Synchro-Listen, ADN-Kalender, Nachrichtenlage.
# Die stündliche Aktion deckt nur Crunchyroll ab.

on:
  schedule:
    # 04:17 UTC — abseits der vollen Stunde, damit die Fremd-APIs nicht
    # gleichzeitig von tausend Cron-Jobs getroffen werden.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Siehe refresh-hourly.yml: ohne `ref` checkt ein eingereihter Lauf
          # den Stand von vor seiner Wartezeit aus und scheitert am Push.
          ref: main

      # Meldet der Statusanzeige, dass hier etwas läuft. Ohne LAUF_TOKEN
      # passiert nichts — eine fehlende Meldung darf keinen Lauf rot machen.
      # Das Meldeskript an einen Ort legen, den kein Zweigwechsel wegnimmt.
      #
      # Am 21.08.2026 hat ein Auftrags-Lauf seinen eigenen Zweig angelegt und
      # ist dorthin gewechselt — auf dem gab es `tools/lauf-melden.sh` noch
      # nicht. Die Abmeldung scheiterte mit Exit 127 und machte einen Lauf rot,
      # dessen Arbeit fertig und richtig war.
      - name: Melder bereitlegen
        run: |
          cp tools/lauf-melden.sh "$RUNNER_TEMP/lauf-melden.sh"
          echo "MELDER=$RUNNER_TEMP/lauf-melden.sh" >> "$GITHUB_ENV"

      - name: Lauf anmelden
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" laeuft

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Cache für die stündliche Aktion mitfüllen — die kann sich `data:fetch`
      # sonst nicht sparen.
      - name: AniList-Cache ablegen
        uses: actions/cache@v4
        with:
          path: data/cache
          key: anilist-cache-${{ github.run_id }}
          restore-keys: anilist-cache-

      - name: Browser für den Crunchyroll-Kalender installieren
        run: npx playwright install --with-deps chromium

      - name: Rohdaten holen
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run data:fetch

      - name: Deutsche Sendezeiten von Crunchyroll lesen
        # Schlägt der Lauf fehl (Seitenumbau, Ausfall), bleiben die zuletzt
        # gespeicherten Zeiten stehen — der Build läuft trotzdem weiter.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:crunchyroll

      - name: ADN-Kalender lesen
        # Liefert Datum, Uhrzeit UND Sprachfassung — die einzige Quelle neben
        # Crunchyroll, die die Synchro selbst ausweist.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:adn

      - name: Nachrichtenlage bei Anime2You prüfen
        # Erzeugt nur Vorschläge für die Kuratierung, keine Termine.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:anime2you

      - name: Deutsche Texte und Anbieter von aniSearch
        # Vom 09. bis 10.08.2026 ausgesetzt: anisearch.de war vom Anschluss des
        # Betreibers aus nicht erreichbar, und ob der Lauf davor das ausgelöst
        # hatte, war offen. Die Sperre ist von selbst verschwunden — ohne dass
        # wir etwas geändert hätten. Das spricht dafür, dass sie eine
        # zeitlich begrenzte Reaktion auf den allerersten Lauf war, der mit 60
        # Anfragen je Minute lief, und nicht auf den sauberen mit 10.
        #
        # Kontingent und Takt stehen im Skript (200 Titel, alle sechs Sekunden).
        # Der Bestand liegt im Repo und geht nicht verloren.
        continue-on-error: true
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:anisearch

      - name: Datensatz bauen
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run data:build

      - name: Vorschaubilder für neue Releases erzeugen
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:og

      - name: Änderungen committen
        # `always()`, aus demselben Grund wie im Wochenlauf: Bricht der Aufbau an
        # einem Widerspruch ab, sind die Quellen dieses Laufs das Einzige, was
        # ihn reparieren kann — und aniSearch gibt eine Seite pro Sekunde her.
        # Der Job bleibt rot, die Ernte bleibt da.
        if: always()
        run: |
          bash tools/commit-data.sh "chore(data): Datensatz automatisch aktualisiert"

      # Zuletzt, damit der Datenstand auch dann committet ist, wenn die Prüfung
      # anschlägt. Ein roter Lauf schickt dem Betreiber eine Mail — das ist die
      # Meldung „eine Quelle ist stumm geworden", ohne eigene Infrastruktur.
      - name: Quellen auf Schweigen prüfen
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: npm run data:check

      - name: Ergebnis nach Discord melden
        # Nur bei einem Fehlschlag. Dieser Lauf läuft täglich beziehungsweise
        # stündlich; eine Erfolgsmeldung wäre Lärm in einem Kanal, den auch
        # andere lesen.
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: bash tools/discord-melden.sh "Täglicher Datenlauf" "${{ job.status }}"

      # Läuft auch nach einem Fehler: Der rote Lauf ist der, den man sehen will.
      - name: Lauf abmelden
        continue-on-error: true
        if: always()
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
        run: bash "$MELDER" "${{ job.status == 'success' && 'ok' || job.status == 'cancelled' && 'abgebrochen' || 'fehler' }}"
