name: adn-poc-tmp
on:
  pull_request:
    paths:
      - .github/workflows/adn-poc-tmp.yml
permissions:
  contents: read
jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Abruf ueber Wegwerf-Worker
        env:
          P: ${{ secrets.ADN_POC_P }}
        run: |
          for id in 1125 405; do
            curl -s --max-time 30 "https://ak-adn-poc-tmp.animekalender.workers.dev/$P?id=$id"; echo
          done
