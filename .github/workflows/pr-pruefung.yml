name: PR-Prüfkette

# Pflicht-Check für Pull Requests auf main (Spezifikation: daniel-zum-abarbeiten/berichte/pruefweg-pr-spezifikation.md, 2a).
# Bis zum 10.10.2026 lief jede Prüfung erst nach dem Merge. Der Job `kette` heißt `PR-Prüfkette`; dieser Name ist der
# Pflicht-Check im Ruleset. Berührt keinen Datenlauf: nur `pull_request`, nur lesen.
#
# Seit 16.10.2026 laufen die Prüfungen von `check:vor-commit` in fünf parallelen Teiljobs; `kette` ist der Sammeljob und nur grün,
# wenn alle Teiljobs `success` melden (übersprungen oder abgebrochen = rot). Jede Prüfung aus `check:vor-commit` steht in genau einem
# Teiljob; `tools/pr-kette-pruefen.mjs` (Test in `check:workflows`) rechnet das nach und prüft die `needs` des Sammeljobs.
#
# Kein Pfadfilter auf Workflow-Ebene: ein ausgefilterter Pflicht-Check meldet sich nie, der PR hinge fest.
# Daten-PRs der Sammler (`daten/`) überspringt jeder Job-`if` — übersprungen zählt als bestanden.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Ortszeit wie Daniels Rechner (Windows, Berlin): Tests mit UTC-Annahme fallen sonst erst lokal auf (19.10.2026).
env:
  TZ: Europe/Berlin

concurrency:
  group: pr-pruefung-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  logik:
    name: Kette – Logik
    if: ${{ !startsWith(github.head_ref, 'daten/') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kette-einrichten
        with:
          playwright: 'true'
      - run: npm run check:logic

  bau:
    name: Kette – Bau und Installation
    if: ${{ !startsWith(github.head_ref, 'daten/') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kette-einrichten
        with:
          playwright: 'true'
      - name: Bauen
        env:
          PAGES_BASE: /
          VITE_NEWSLETTER_API: ${{ vars.NEWSLETTER_API_URL }}
        run: npm run build
      # `check:install` rendert mit Chromium und liest das gebaute `dist/`.
      - name: Installationszustände
        env:
          PAGES_BASE: /
        run: npm run check:install
      # Der Deploy nach dem Merge liefert diesen geprüften Bau aus, wenn der Git-Baum des Merge-Commits dem hier gebauten gleicht
      # (`dist/version.json` trägt ihn; tools/deploy-aus-build.mjs). Letzter Schritt: nur ein Bau, der `check:install` bestand.
      - name: Bau für den Deploy bereithalten
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 3

  workflows:
    name: Kette – Workflows
    if: ${{ !startsWith(github.head_ref, 'daten/') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kette-einrichten
        with:
          playwright: 'true'
      - run: npm run check:workflows

  typen:
    name: Kette – Typen und Worker
    if: ${{ !startsWith(github.head_ref, 'daten/') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kette-einrichten
      - run: npm run typecheck
      - run: npm run check:worker
      - run: npm run check:hooks

  uebrige:
    name: Kette – Daten, Erweiterung, Belege
    if: ${{ !startsWith(github.head_ref, 'daten/') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/kette-einrichten
        with:
          playwright: 'true'
      - run: npm run data:validate
      - run: npm run check:vorlieben
      - run: npm run check:extension
      - run: npm run check:wiedervorlage
      - run: npm run check:zugangsart
      - run: npm run check:beleg-wand
      - run: npm run check:beleg-reihenfolge
      - run: npm run check:woche-bild
      - run: npm run check:pfade
      - run: npm run check:search

  # Sammeljob: der Name `PR-Prüfkette` ist der Pflicht-Check im Ruleset. `always()` ist Pflicht: ohne es würde ein roter Teiljob
  # diesen Job überspringen, und übersprungen zählt als bestanden. Hier zählt nur `success`.
  kette:
    name: PR-Prüfkette
    needs: [logik, bau, workflows, typen, uebrige, datenbau, aussehen]
    if: ${{ always() && !startsWith(github.head_ref, 'daten/') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Alle Teiljobs grün?
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node tools/kette-urteil.mjs


  # Datenbau (16.10.2026): `pipeline/lib/pruefung.ts` lief nur im Bestandsbau nach dem Merge; PR 1368 setzte ein Feld, das ein späterer Bauschritt
  # anders vererbt, und main brach ab. Der Job baut den Datensatz wie `bestand-bauen.yml` (Cache `anilist-cache-`, nur lesen) ohne Commit; ein
  # Widerspruch macht ihn rot. Bewusst ohne Pfadfilter: die Eingaben des Baus reichen bis in `web/src/lib` (news-text, i18n), eine Positivliste
  # ginge am Importgraph vorbei; der Job läuft parallel zur längsten Kette. Form fest: tools/pr-kette-datenbau.mjs.
  datenbau:
    name: PR-Datenbau
    if: ${{ !startsWith(github.head_ref, 'daten/') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Tiefe 2: die Bestandsprüfungen bauen bei Rot die Basis HEAD^1 zum Vergleich.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/kette-einrichten
      - name: AniList-Cache lesen
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: anilist-cache-${{ github.run_id }}
          restore-keys: anilist-cache-
      - if: steps.cache.outputs.cache-matched-key == ''
        name: Kein Cache vorhanden
        run: |
          echo "::error::Kein anilist-cache gefunden"
          exit 1
      - name: Datensatz bauen (ohne Commit)
        run: npm run data:build
      # Gemessenes Ja ⇒ mindestens ein Weg, am frisch gebauten Datensatz (18.10.2026: Hazbin Hotel und fünf weitere Cartoons).
      - name: Gemessenes Ja hat einen Weg
        run: npx tsx pipeline/check-ja-hat-weg-bestand.ts
      # Bestandsprüfungen (16.10.2026): `check:bestand` lief nur im Bestandsbau nach dem Merge; PR 1377 hätte dort `check-cartoon-wege-bestand` rot gemacht.
      # Hier auf der frisch gebauten Ausgabe, jede Prüfung ohne Abbruch; rot nur, was auf der Basis HEAD^1 (main im Merge-Ref) grün ist (17.10.2026).
      - name: Bestandsprüfungen auf der Bauausgabe
        run: node tools/pr-bestand-vergleich.mjs HEAD^1

  # Aussehen (wie aussehen-pruefen.yml), nur bei Änderungen an der Oberfläche; sonst endet jeder Teil nach der Pfadprüfung grün.
  # Drei parallele Teile statt einer Kette (16.10.2026): die längste Kette wächst durch die Trefferprobe sonst um ≈ 130 s. Jeder Teil
  # baut selbst (parallel kostet das keine Wartezeit; ein Artefakt-Umweg würde seriell Hoch- und Herunterladen anhängen). Der Sammeljob
  # führt `aussehen` in `needs`, ein roter Teil hält also den Merge auf.
  aussehen:
    name: PR-Aussehen – ${{ matrix.teil }}
    if: ${{ !startsWith(github.head_ref, 'daten/') && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - teil: Panel
            befehl: npm run check:panel
          - teil: Ansichten
            befehl: npm run check:ansichten-desktop
          - teil: Ansichten Handy
            befehl: npm run check:ansichten-handy
          - teil: Einstellungen
            befehl: npm run check:einstellungen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Betrifft der PR die Oberfläche?
        id: pfad
        run: |
          # Außer der Oberfläche zählen genau die Dateien, die dieser Job ausführt: die Werkzeuge von check:panel und
          # check:ansichten, deren direkte Importe und dieser Workflow.
          PFADE='^(web/src/|extension/.*\.css$|\.github/workflows/pr-pruefung\.yml$|package\.json$'
          PFADE="$PFADE|tools/(panel-bild|ansicht-bild|ak-von|bilder-ordner|dist-frisch|panel-sperre"
          PFADE="$PFADE|schwer|schwerer-lauf|einzel-sperre|einzel-sperre-schlange|bau-vergleich-log"
          PFADE="$PFADE|ansicht-filterfenster|ansicht-filterfenster-rechner|ansicht-adressen"
          PFADE="$PFADE|ansicht-trefferprobe|trefferprobe-browser|trefferprobe-ausnahmen|trefferprobe-selbsttest"
          PFADE="$PFADE|panel-messen|panel-messen-browser|panel-reihe-schalter|panel-sprung|panel-zurueck|such-chip-messen"
          PFADE="$PFADE|aehnlich-kacheln-bild|ansicht-hover-cover|ansicht-hover-cover-zeilen|ansicht-hover-weitere|einstellungen-bild|ansicht-statusfarben|ecken-urteil|kachel-ecken-messen)\.mjs$)"
          if git diff --name-only HEAD^1 HEAD | grep -qE "$PFADE"; then
            echo "betroffen=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pfad.outputs.betroffen == '1'
        uses: ./.github/actions/kette-einrichten
        with:
          playwright: 'true'
      - if: steps.pfad.outputs.betroffen == '1'
        run: npm run build
      - if: steps.pfad.outputs.betroffen == '1'
        run: ${{ matrix.befehl }}
