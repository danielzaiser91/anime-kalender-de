# Einen einzelnen Datenlauf anstoßen, ohne den ganzen Wochenlauf mitzunehmen.
#
# **Warum es das gibt.** Die vier planmäßigen Workflows decken den Regelfall ab,
# aber sie sind Pakete: Wer die TMDB-Folgen nachholen will, stößt sonst einen
# Tiefendurchlauf über alle Quellen an — vierzig Minuten für eine Sache, die drei
# braucht. Und lokal laufen sollen Datenläufe nicht (siehe CLAUDE.md, „Datenläufe
# laufen remote").
#
# **Die Auswahl ist fest.** Ein Freitextfeld, das in eine Shell wandert, ist eine
# offene Tür — auch in einem privaten Repo. Wer einen neuen Lauf braucht, trägt
# ihn hier ein; das ist eine Zeile und ein Commit.
#
# **`data:build` steht bewusst nicht zur Wahl.** Dieser Workflow holt keinen
# Cache (`NUR_QUELLEN`), und der Bau bricht ohne AniList-Daten ab — am
# 28.08.2026 einmal ausprobiert und prompt rot geworden. Wer den Datensatz neu
# bauen will, nimmt den Tageslauf.
name: Datenlauf auf Abruf

on:
  workflow_dispatch:
    inputs:
      lauf:
        description: 'Welcher Lauf'
        required: true
        type: choice
        options:
          - data:tmdb-folgen
          - data:tmdb
          - data:anisearch
          - data:anisearch-folgen
          - data:anisearch-titel
          - data:cr-dub
          - data:extension-liste
          # Der Gesamtkatalog läuft sonst nur wöchentlich. Auf Abruf braucht man
          # ihn, wenn sich die **Regel** geändert hat, nach der Reihen gebaut
          # werden — dann sind die gespeicherten `rel`-Listen falsch, und kein
          # planmäßiger Lauf merkt das von allein (03.09.2026: `OTHER` klebte
          # Gundam an Patlabor, der Fix kam erst mit dem nächsten Volllauf an).
          - data:katalog
      grenze:
        description: 'Höchstzahl Titel (nur wo der Lauf --limit kennt)'
        required: false
        default: '300'
        type: string

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  lauf:
    runs-on: ubuntu-latest
    # Zwei Stunden statt 45 Minuten: Die aniSearch-Folgenlisten sind der Anker,
    # an dem die ganze Folgen-Zuordnung haengt, und sie kommen im Sechs-Sekunden-
    # Takt — 45 Minuten sind 450 Titel, bei 2.615 offenen also sechs Laeufe.
    # Der Takt selbst bleibt unangetastet; laenger heisst nicht schneller,
    # sondern nur, dass ein Lauf nicht mittendrin abgeschnitten wird.
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `data/cache/` liegt bewusst nicht im Repo. Der Katalog-Lauf setzt darauf
      # auf und der Bau braucht ihn — ohne diesen Schritt hätte ein Abruf hier
      # keine Wirkung auf den nächsten Bau. Derselbe Schlüssel wie in
      # `bestand-bauen.yml`, damit beide dieselbe Ablage benutzen.
      - name: AniList-Cache wiederverwenden
        uses: actions/cache@v4
        with:
          path: data/cache
          key: anilist-cache-${{ github.run_id }}
          restore-keys: anilist-cache-

      - name: Lauf ausführen
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
          CR_ZUGANG: ${{ secrets.CR_ZUGANG }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          LAUF='${{ inputs.lauf }}'
          GRENZE='${{ inputs.grenze }}'
          # Nicht jeder Lauf kennt --limit; die, die es nicht tun, bekommen es nicht.
          case "$LAUF" in
            data:tmdb-folgen|data:tmdb|data:anisearch|data:anisearch-folgen|data:anisearch-titel|data:cr-dub)
              npm run "$LAUF" -- --limit "$GRENZE" ;;
            *)
              npm run "$LAUF" ;;
          esac

      - name: Ergebnis committen
        env:
          LAUF_TOKEN: ${{ secrets.LAUF_TOKEN }}
          NUR_QUELLEN: '1'
        run: |
          bash tools/commit-data.sh "chore(data): Lauf auf Abruf"
