name: Crunchyroll — Weiche aus der Cloud messen

# Einmalige Messung (16.09.2026): Als welches Land sieht Crunchyroll die Weiche
# (worker-cr/), wenn ein GitHub-Runner in den USA sie aufruft — und trägt ein
# in Deutschland geholtes Token die Staffelliste auch von hier aus?

on:
  workflow_dispatch:
    inputs:
      token:
        description: 'Anonymes Crunchyroll-Token aus Deutschland (1 Stunde gültig)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  messen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose der Weiche
        env:
          CR_WEICHE_TOKEN: ${{ secrets.CR_WEICHE_TOKEN }}
        run: |
          curl -sS -H "X-Weiche-Token: $CR_WEICHE_TOKEN" "https://cr-weiche.animekalender.workers.dev/?diag=1"
          echo
      - name: Deutsches Token gegen US-Token, Pruefstein Fairy Tail
        if: inputs.token != ''
        env:
          TOKEN_DE: ${{ inputs.token }}
        run: |
          cat > pruef.mjs <<'JS'
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/128.0 Safari/537.36'
          const us = await fetch('https://beta-api.crunchyroll.com/auth/v1/token', { method: 'POST', headers: { Authorization: 'Basic ' + Buffer.from('noaihdevm_6iyg0a8l0q:').toString('base64'), 'Content-Type': 'application/x-www-form-urlencoded', 'User-Agent': UA }, body: 'grant_type=client_id' }).then((r) => r.json())
          for (const [name, tok] of [['DE-Token', process.env.TOKEN_DE], ['US-Token (' + us.country + ')', us.access_token]]) {
            for (const serie of ['G6DQDD3WR', 'G6ZJMGEXY']) {
              const j = await fetch('https://beta-api.crunchyroll.com/content/v2/cms/series/' + serie + '/seasons?locale=de-DE', { headers: { Authorization: 'Bearer ' + tok, 'User-Agent': UA } }).then((r) => r.json())
              console.log(name, serie, (j.data ?? []).map((x) => x.title.slice(0, 25) + ':' + ((x.versions ?? []).map((v) => v.audio_locale).includes('de-DE') ? 'DE' : '-')).join(' | ') || JSON.stringify(j).slice(0, 200))
            }
          }
          JS
          node pruef.mjs
