name: PR-Kette nachrechnen

# Kommt Code auf main, stößt dieser Lauf die PR-Prüfkette aller offenen PR neu an, deren Kette vor dem Push begann (Befund 19.10.2026:
# repoweite Grenzwerte waren im PR grün und auf main rot, weil die Kette gegen den alten main gerechnet hatte).
# Warum Schließen und Öffnen: `gh run rerun` nutzt denselben Merge-Commit; erst `reopened` baut `refs/pull/N/merge` neu auf dem jetzigen main.
# Warum ein App-Token: Ereignisse von GITHUB_TOKEN lösen keine Workflows aus. Die App `anime-kalender-daten` darf bereits PR bearbeiten (claude-daten-merge.yml).
# Reine Daten-Pushes (Sammler, stündlich) lassen die Ketten in Ruhe: die Grenzwert-Wächter lesen Code, nicht Daten.
# Der Pflicht-Check `PR-Prüfkette` bleibt bis zum neuen Ergebnis offen; gemerged wird erst, wenn er auf dem frischen Stand grün ist.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
      - 'data/**'
      - 'docs/**'
      - 'daniel-zum-abarbeiten/**'

permissions:
  contents: read
  pull-requests: read
  actions: read

# Nacheinander statt abbrechen: ein abgebrochener Lauf könnte zwischen Schließen und Öffnen stehen.
concurrency:
  group: pr-nachrechnen
  cancel-in-progress: false

jobs:
  nachrechnen:
    name: Ketten neu anstoßen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: App-Token holen
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DATEN_APP_ID }}
          private-key: ${{ secrets.DATEN_APP_KEY }}
          permission-pull-requests: write
      - name: Veraltete Ketten neu anstoßen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_SCHREIBEN: ${{ steps.app.outputs.token }}
          PUSH_ZEIT: ${{ github.event.head_commit.timestamp }}
        run: node tools/pr-nachrechnen.mjs "$PUSH_ZEIT"
