# Laufende ADN-Serien mehrmals täglich auffrischen.
#
# ## Warum es diesen Lauf gibt
#
# ADN schaltet die deutsche Synchronfassung **nach** der Untertitelfassung frei,
# und für diesen zweiten Termin gibt es kein Feld in der API — er zeigt sich nur
# daran, dass `vde` in `languages` auftaucht. Wer das mitbekommen will, muss
# nachsehen.
#
# Bis zum 24.08.2026 geschah das nur im Wochenlauf (montags 05:41). An diesem Tag
# kannte unser Archiv für „Kill Blue" um 08:36 zwei deutsche Folgen; ein Abruf um
# 12:38 lieferte vier. Daniel hatte die vier um 11:50 von Hand gemeldet — eine
# Handmeldung für etwas, das die Automatik selbst hätte sehen können.
#
# ## Warum viermal und nicht einmal
#
# Der Lauf holt nur die Serien, bei denen sich etwas bewegt: frische Folge in den
# letzten zwei Wochen, **oder** teilweise vertont. Das waren am 24.08.2026 zwanzig
# von 242 Serien und kostete vierzehn Sekunden. Bei diesem Preis ist der Takt
# keine Kostenfrage mehr, sondern eine Frage der Auflösung: Alle sechs Stunden
# grenzt den Zeitpunkt einer Freischaltung auf ein Sechs-Stunden-Fenster ein.
#
# Das ist kein Selbstzweck. `data/adn-vde-historie.json` hält fest, **wann** ein
# `vde` zum ersten Mal gesehen wurde. Nach ein paar Wochen ergibt das eine
# Messreihe, aus der sich ADNs Freischaltrhythmus ablesen lässt — und dann kann
# dieser Takt gezielt gesetzt statt geraten werden.
#
# ## Umbau vom 05.10.2026
#
# Dieser Lauf pushte direkt auf `main` (ein Versuch, ohne Wiederholung) und sicherte nur `data/adn-raw` — die Messreihe `adn-vde-historie.json` stand weder hier
# noch in `tools/quellen-liste.sh` und wurde seit dem 10.09.2026 bei jedem Lauf weggeworfen. Jetzt reicht der Lauf wie alle Sammler per Pull Request ein
# (`tools/quellen-pr.sh`), und die Historie steht in der Quellenliste.
name: ADN — laufende Serien

on:
  # Zeitplan: Cloudflare-Wecker (`worker/src/wecker.ts`) startet diesen Lauf per workflow_dispatch um 02, 08, 14 und 20 Uhr UTC. GitHubs eigener Cron kam
  # gemessen 4–7 Stunden zu spät und würde Läufe verdoppeln; `wecker-wache.yml` holt Überfälliges nach, falls der Wecker ausfällt (05.10.2026).
  workflow_dispatch:

concurrency:
  # Zwei gleichzeitige Läufe würden dieselben Archivdateien schreiben.
  group: adn-laufende
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auffrischen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      fehler: ${{ steps.auswerten.outputs.fehler }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/einrichten
        with:
          cache: restore

      - name: Laufende Serien holen
        run: bash tools/schritt.sh --zeit 15m "Laufende Serien holen" -- npm run data:adn:laufend

      - name: Zusicherungen prüfen
        run: bash tools/schritt.sh --zeit 5m "Zusicherungen prüfen" -- npm run check:adn-gedaechtnis

      # Ein Lauf ohne Änderung ist der Normalfall — die meisten Freischaltungen passieren einmal pro Woche und Serie; dann entsteht kein Pull Request.
      - name: Änderungen einreichen
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/quellen-pr.sh "chore(data): ADN — laufende Serien aufgefrischt"

      - name: Fehlschläge auswerten
        id: auswerten
        if: always()
        run: bash tools/schritte-auswerten.sh
