name: Claude — Probelauf

# Wegwerf-Workflow. Einziger Zweck: nachweisen, dass die Anmeldung über das
# Abo-Token wirklich trägt, bevor wir uns darauf verlassen. Wird nach dem
# erfolgreichen Lauf wieder gelöscht.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'github-actions[bot]'
          claude_args: '--max-turns 2'
          prompt: |
            Antworte mit genau einem Satz auf Deutsch: Nenne das heutige Datum
            und bestätige, dass die Anmeldung funktioniert hat. Keine Werkzeuge
            benutzen, keine Dateien ändern.
