name: Einreichen
description: >
  Reicht die Quellen eines Sammel-Laufs als Pull Request ein (`tools/quellen-pr.sh`) und sichert den Fund vorher als Artefakt. Scheitert das Einreichen
  (Konflikt, Workflow-Dateien weichen ab, GitHub gestört), bleibt der Fund 14 Tage abrufbar und lässt sich mit „Fund nachliefern" einspielen — ein Sammel-Lauf
  verliert seine Arbeit nicht mehr am letzten Schritt (Wochenlauf vom 05.10.2026: 107 Minuten Abrufe gingen so verloren).
inputs:
  nachricht:
    description: 'Commit- und Titelzeile des Pull Requests'
    required: true
  fund:
    description: 'Name des Fund-Artefakts (je Job eindeutig)'
    required: true
  app-id:
    description: 'ID der GitHub-App anime-kalender-daten (Secret DATEN_APP_ID; eine Composite-Action sieht keine Secrets)'
    required: true
  app-key:
    description: 'Privater Schlüssel der App (Secret DATEN_APP_KEY)'
    required: true
runs:
  using: composite
  steps:
    # Die App darf `main` am Ruleset `main-pruefweg` vorbei mergen, `GITHUB_TOKEN` nicht (11.10.2026). Das Aufsetzen und der Zweig-Push laufen weiter mit der Checkout-Anmeldung;
    # nur Anlegen und Mergen des Pull Requests brauchen die App. Gelingt das Token nicht, wird der Lauf rot (kein Rückfall auf github.token: ein nie gemergter PR bliebe unbemerkt); der Einreichen-Schritt läuft trotzdem, damit der Fund gesichert wird.
    - name: App-Token holen
      id: app
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-key }}
        permission-contents: write
        permission-pull-requests: write

    - name: Quellen als Pull Request einreichen
      id: pr
      if: ${{ !cancelled() }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        # Das Aufsetzen legt hier die geänderten Quelldateien ab, bevor es auf den Stand von main wechselt.
        FUND_DIR: ${{ runner.temp }}/fund
        # Über env, nicht in den Skripttext: ein `"` in der Nachricht (fund-nachliefern setzt `inputs.lauf` ein) würde sonst Code mit dem App-Token.
        NACHRICHT: ${{ inputs.nachricht }}
      run: bash tools/quellen-pr.sh "$NACHRICHT"

    - name: Fund sichern
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fund-${{ inputs.fund }}
        path: ${{ runner.temp }}/fund
        retention-days: 14
        if-no-files-found: ignore

    - name: Einreichen fehlgeschlagen
      if: steps.pr.outcome == 'failure'
      shell: bash
      env:
        FUND: ${{ inputs.fund }}
      run: |
        echo "::error::Der Pull Request konnte nicht angelegt werden. Der Fund liegt als Artefakt „fund-${FUND}“ bereit — „Fund nachliefern“ spielt ihn ein."
        exit 1
