name: Kette einrichten
description: >
  Gemeinsamer Anfang der Teiljobs der PR-Prüfkette: Node, Abhängigkeiten (node_modules aus dem Cache, wenn package.json und package-lock.json gleich blieben),
  Chromium (Browser-Cache). Steht an einer Stelle, damit die Teiljobs sich nicht auseinanderentwickeln (16.10.2026).
inputs:
  playwright:
    description: 'Chromium für Playwright bereitlegen'
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    # Treffer: node_modules samt .bin-Verknüpfungen kommt fertig zurück, `npm ci` entfällt. Schlüssel = package.json und Lockdatei (sonst entfiele bei Treffer der Abgleich von `npm ci`), Node-Hauptversion, Betriebssystem.
    - name: node_modules aus dem Cache
      id: nm
      uses: actions/cache@v4
      with:
        path: node_modules
        key: nm-${{ runner.os }}-node22-${{ hashFiles('package.json', 'package-lock.json') }}

    - name: Abhängigkeiten installieren
      if: steps.nm.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - name: Browser-Cache
      if: inputs.playwright == 'true'
      id: pw
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    # `playwright install(-deps)` ruft `apt-get update`; die vorinstallierte Microsoft-Quelle antwortete am 20.10.2026 mit 403 und riss die Kette ohne Codefehler. Chromium braucht sie nicht.
    - name: Microsoft-Paketquelle entfernen
      if: inputs.playwright == 'true'
      shell: bash
      run: sudo grep -l packages.microsoft.com /etc/apt/sources.list.d/* | sudo xargs -r rm -fv || true

    # Ohne Cache-Treffer lädt `install` den Browser samt Systempaketen; mit Treffer fehlen nur die Systempakete.
    - name: Chromium installieren
      if: inputs.playwright == 'true' && steps.pw.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Chromium-Systempakete
      if: inputs.playwright == 'true' && steps.pw.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
