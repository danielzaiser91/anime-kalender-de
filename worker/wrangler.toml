name = "newsletter"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# Stündlich wecken; ob wirklich versendet wird, entscheidet der Worker anhand
# der Berliner Ortszeit — so stimmt der Versandzeitpunkt auch über die
# Sommerzeitumstellung hinweg, ohne zwei Cron-Einträge zu verbrauchen.
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "anime-kalender"
database_id = "ee32d6b3-0290-4ad3-b899-da37577a8d20"

[vars]
SITE_URL = "https://anime-kalender.de/"
ALLOWED_ORIGIN = "https://anime-kalender.de"
MAIL_PROVIDER = "resend"       # resend | brevo | console
FROM_EMAIL = "kalender@send.anime-kalender.de"
FROM_NAME = "Anime-Kalender DE"
SEND_HOUR_BERLIN = "7"
# Empfänger der Überwachungsmeldungen
MONITOR_EMAIL = "danielzaiser91@googlemail.com"
# Wird nach dem ersten Deploy mit der tatsächlichen Worker-Adresse gefüllt;
# sie steckt in jedem Abmeldelink.
WORKER_URL = "https://newsletter.animekalender.workers.dev"

# Geheim setzen mit:  wrangler secret put MAIL_API_KEY
