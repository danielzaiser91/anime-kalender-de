<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <!-- Diese Zeile ist für Google da, nicht für den Browser-Tab.
         In der Ergebnisliste stand statt unseres Symbols der graue Globus
         (17.08.2026). Angemeldet waren nur das SVG und ein 32er PNG, und die
         Google-Dokumentation empfiehlt ausdrücklich mehr als 48 Pixel: „we
         recommend using a favicon that's larger than 48x48px so that it looks
         good on various surfaces". Ein Rastersymbol in 96 Pixeln nimmt Googlebot
         jede Ausrede — SVG steht auf seiner Liste, aber sicher ist sicher. -->
    <link rel="icon" href="/icons/favicon-96.png" sizes="96x96" type="image/png" />
    <!-- Apple liest weder das Manifest noch die icon-Liste; es braucht diese
         eine Zeile, sonst landet ein Bildschirmfoto auf dem Home-Bildschirm. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Anime-Kalender" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- social:start
      Alles zwischen diesen Markern tauscht `pipeline/build-share-pages.ts` beim
      Bauen gegen release-eigene Angaben aus. Grund: WhatsApp, Discord, Telegram
      und Co. führen kein JavaScript aus — sie lesen die ausgelieferte HTML-Datei
      und hören dann auf. Eine Vorschau je Titel muss also als echte Datei unter
      einem echten Pfad existieren; alles hinter dem `#` sieht ein Crawler nie.
    -->
    <!--
      Steht innerhalb des social-Blocks: Die Teilen-Seiten tauschen ihn gegen
      ihre eigene Adresse aus. Auf der Startseite sagt er Google, welche der drei
      erreichbaren Adressen die richtige ist — es gibt sie noch unter
      danielzaiser91.github.io und unter www., und beide leiten hierher um. Ohne
      diese Zeile bleibt es Googles Vermutung, und die Search Console meldet
      „Seite mit Weiterleitung" (16.08.2026).
    -->
    <link rel="canonical" href="https://anime-kalender.de/" />
    <title>Anime-Kalender DE — alle Anime mit deutscher Synchro</title>
    <meta
      name="description"
      content="Wochenkalender aller Anime-Releases mit deutscher Synchronisation: Termine, Uhrzeiten, Plattform, FSK und Genres. Mit Google-Calendar-Export und Newsletter."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Anime-Kalender DE" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:url" content="https://anime-kalender.de/" />
    <meta property="og:title" content="Anime-Kalender DE — alle Anime mit deutscher Synchro" />
    <meta
      property="og:description"
      content="Jede Woche auf einen Blick, was mit deutscher Synchro erscheint — Streaming, Disc und Kino, mit Uhrzeit, Plattform und FSK."
    />
    <meta
      property="og:image"
      content="https://anime-kalender.de/og/default.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Anime-Kalender DE — Wochenkalender für Anime mit deutscher Synchronisation"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Anime-Kalender DE — alle Anime mit deutscher Synchro" />
    <meta
      name="twitter:description"
      content="Jede Woche auf einen Blick, was mit deutscher Synchro erscheint."
    />
    <meta
      name="twitter:image"
      content="https://anime-kalender.de/og/default.jpg"
    />
    <!-- social:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
