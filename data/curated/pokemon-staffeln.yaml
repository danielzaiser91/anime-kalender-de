# Deutsche Staffelgrenzen der Pokémon-TV-Serie innerhalb der AniList-Sammeltitel (Auftrag Dirigent, 20.11.2026).
#
# Warum: AniList führt die Serie in wenigen langen Einträgen (527 = 276 Folgen); die Reihe zählte dadurch 13 „Staffeln“ statt der 25 deutschen.
# Wirkung: `staffelQuelle` jedes Titels = die Staffel, in der er beginnt (`pipeline/lib/pokemon-staffeln.ts`, `alleStaffelQuellen()`); die
# Detaildatei `public/data/folgen/<Kennung>.json` trägt die Liste als `s: [[Staffel, von, bis], …]` (Titelnummern).
#
# Quelle: TMDB tv/60572 („Pokémon“, deutsche Folgentitel), `data/tmdb-folgen.json` (geholt 2026-10-06), gelesen 20.11.2026:
# https://www.themoviedb.org/tv/60572/seasons. Staffelnummern = TMDB-Staffeln 1–25 (Staffel 0 = Extras zählt nicht).
# Zuordnung Titel ↔ Staffel: jeder deutsche aniSearch-Folgentitel (`public/data/folgen/<Kennung>.json`) wird gegen die TMDB-Titel an
# derselben Stelle gelegt (Schreibweise ignoriert, Abweichung um bis zu 4 Stellen erlaubt); `treffer` nennt die Übereinstimmungen. Eine
# Folge ohne Treffer gehört zur Staffel der Folge davor. Keine Zahl ist geraten.
#
# Felder je Abschnitt: nr (deutsche Staffel), von/bis (Folgennummer im Titel), folgen (bis − von + 1).
# Namen der Staffeln (Indigo-Liga …) stehen nicht in den TMDB-Daten und fehlen bewusst; sie kommen mit Quelle in einem späteren Lauf.
#
# Abweichungen zwischen aniSearch und TMDB (die beiden Reste des Zählens):
# - 1564: aniSearch zählt „Deoxys aus dem All“ als Folge 171 und 172, TMDB als eine (Staffel 9, Folge 26): 192 gegen 191.
# - 19291: aniSearch führt Folge 24 „Ein Zuhause auf dem Meeresgrund!“, die TMDB-Staffel 17 nicht kennt; dafür kennt TMDB in Staffel 18 eine
#   Folge, die aniSearch nicht führt. Die Staffelgrenze liegt darum bei Folge 49/50 statt 48/49.
# - 21356: TMDB-Staffel 19 hat 49 Folgen; Folge 48 „Die Legende von X,Y und Z!“ ist der Sondertitel 10011938, Folge 49 „Das Ultimative Duo“
#   hat keinen Titel im Datensatz (offen).
