# Anime-Kinostarts im deutschsprachigen Raum 2026.
#
# Ein Kinostart ist ein einzelner Termin, deshalb `releaseType: movie` und
# `platform: kino`. `publisher` trägt hier den Verleih, nicht das Disc-Label.
#
# Wichtig für dieses Projekt: Ein Kinostart bedeutet **nicht** automatisch eine
# deutsche Synchronfassung. Viele Filme laufen zunächst nur im Original mit
# Untertiteln, und die Verleiher lassen die Sprachfassung in der Ankündigung oft
# ausdrücklich offen. Wo das so ist, steht es in `note` — geraten wird nichts.

