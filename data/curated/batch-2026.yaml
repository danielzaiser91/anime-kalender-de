# Katalogtitel: ganze Staffeln, die an einem Tag komplett erscheinen.
#
# Das ist der Normalfall bei Netflix, Disney+ und Prime Video — dort gibt es
# keinen wöchentlichen Sendeplatz, sondern einen Stichtag, ab dem alles da ist.
# Deshalb `releaseType: batch` und genau ein Termin statt einer Serie.
#
# Aufgenommen wird nur, was ausdrücklich **mit deutscher Synchronfassung**
# angekündigt ist. Titel, bei denen die Anbieter die Sprachfassung offen lassen
# (im August 2026 etwa die Fate-Reihe und der Gintama-Film bei Netflix), fehlen
# hier bewusst — dieses Projekt behauptet keine Synchro, die niemand belegt hat.
#
# Uhrzeit: Netflix und Disney+ nennen für Katalogtitel keine. Sie bleibt leer,
# die Oberfläche schreibt dann „Zeit offen".

