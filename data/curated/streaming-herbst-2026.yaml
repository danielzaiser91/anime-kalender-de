# Angekündigte Streaming-Starts der Herbstsaison 2026.
#
# **Was hier steht, ist angekündigt und nicht auf den Tag belegt.** Für jeden
# Eintrag gilt: Der Monat stammt aus einer benannten Quelle, der Tag nicht —
# deshalb durchgehend `estimated: true`, und der Grund steht in der `note`.
# Sobald ein Anbieter den Tag nennt, wird das Datum ersetzt und `estimated`
# entfernt.

- slug: black-clover-s2-crunchyroll
  anilistId: 195604
  search: "Black Clover 2nd Season"
  titleDe: "Black Clover – Staffel 2"
  platform: crunchyroll
  releaseType: weekly
  schedule:
    firstEpisodeDate: "2026-10-03"
    estimated: true
  # **Stand 15.09.2026:** Anime2You (07.09.2026) und Crunchyroll nennen den
  # 03.10.2026 als Start in Japan, Crunchyroll zeigt die Folgen im Simulcast mit
  # Untertiteln; die deutsche Fassung steht dort als „TBA". Das Datum ist damit
  # der OmU-Start, übernommen mit `estimated` — so erlaubt es CLAUDE.md
  # („Datum aus dem Simulcast-Start übernommen statt aus einer Dub-Ankündigung").
  # Vorher stand hier der Monatserste als Platzhalter, und AniLists fehlender Tag
  # erschien im Panel als „JP 31.10.2026" (Daniel, 15.09.2026).
  #
  # **Ursprünglich: drei Angaben fehlen, und jede einzelne wäre geraten.**
  #
  # Crunchyroll hat die Staffel am 15.06.2026 für Oktober 2026 angekündigt —
  # ohne Tag. AniList führt denselben Stand (am 04.09.2026 abgefragt:
  # `startDate { year: 2026, month: 10, day: null }`, `episodes: null`,
  # Status NOT_YET_RELEASED). Auch die Folgenzahl ist damit unbelegt.
  #
  # **Und eine deutsche Fassung nennt keine der beiden Quellen.** Die erste
  # Staffel liegt bei Crunchyroll mit 170 deutschen Folgen — ein starker
  # Hinweis, aber kein Beleg. Der Eintrag steht trotzdem: „Unsicheres
  # kennzeichnen statt weglassen" ist der Grund, warum es diesen Kalender gibt
  # (Daniel, 04.09.2026: „warum führen wir keine staffel 2 und haben auch nicht
  # diese info auf der webseite?").
  # **25.09.2026: Die Synchro ist angekündigt.** Crunchyrolls Artikel „Crunchyroll kündigt die
  # deutschen Synchros für Herbst 2026 an" (15.09.2026) führt Black Clover Staffel 2, das
  # Lineup nennt „OmU: 3. Oktober, DE: TBA". Der alte Satz „Eine deutsche Fassung ist noch
  # nicht angekündigt" war seit dem 15.09. falsch.
  note: "Crunchyroll zeigt die Staffel ab dem 03.10.2026 mit Untertiteln. Die deutsche Synchro ist angekündigt, ihr Termin noch offen — das Datum ist der Start mit Untertiteln."
  sources:
    - https://www.crunchyroll.com/de/news/seasonal-lineup/2026/9/15/crunchyroll-deutsche-synchros-herbst-2026
    - https://www.crunchyroll.com/de/news/seasonal-lineup/2026/9/15/crunchyroll-anime-lineup-herbst-2026
    - https://www.anime2you.de/news/1047190/black-clover-second-season-termin/
    - https://www.crunchyroll.com/news/latest/2026/6/15/black-clover-season-2-anime-october-2026-release-date-director
    - https://www.crunchyroll.com/de/news/latest/2026/6/15/black-clover-staffel-2-premiere-oktober-2026
    - https://anilist.co/anime/195604

