  titleDe: "Tokyo Revengers: War of the Three Titans"
  platform: disneyplus
  # Disney+ führt alle Staffeln unter einer Adresse; gewählt wird im Auswahlfeld (dort „Staffel 3", Disney fasst die
  # AniList-Staffeln 2 und 3 zusammen). Ein Adressparameter für die Staffel ist nicht bekannt (Daniel, 04.10.2026).
  platformUrl: https://www.disneyplus.com/de-de/browse/entity-be391742-6617-42ad-b53a-be368ee73335
  releaseType: weekly
  # **Zeitquelle ist der offizielle Zeitplan, nicht Anime2You** (Daniel, 04.10.2026): Die offizielle Serienseite (24.08.2026)
  # nennt Disney+ weltweit „ab 2.10., freitags 2:00 Uhr" in japanischer Nachtzählung = Samstag 02:00 JST = Freitag 19:00 Uhr
  # MESZ; Disney+ Brasilien meldet „jede Woche freitags 14:00" (= 17:00 UTC, passt). Ab 25.10. gilt MEZ, die Folge kommt dann
  # um 18:00 (`zeiten`). Anime2You nennt „samstags 19:00 Uhr" — der Unterschied steht offen im Hinweis; am 09.10. 19:00 prüft
  # Daniel (Kalender-Notiz). Folge 1 ist gesehen (Disney+ „Neue Folge", Anime2You 02.10. 19:55 „ab sofort").
  note: "Disney+ weltweit: freitags um 19:00 Uhr (ab 30.10. um 18:00 Uhr) laut offizieller Serienseite. Anime2You nennt samstags um 19:00 Uhr."
  # Text der News-Meldung „Rückwirkend eingetragen" (Entwurf G, Daniel 04.10.2026): erster Satz = Weiterlaufen, der Rest steht hinter „mehr".
  nachtrag:
    kurz: "Die Serie läuft im Simulcast wöchentlich freitags um 19 Uhr; die nächste Folge erscheint voraussichtlich am 09.10."
    abschnitte:
      - art: quelle
        text: "Wir folgen der offiziellen Serienseite: Disney+ weltweit, Samstag 2:00 Uhr japanischer Zeit, das ist Freitag 19:00 Uhr in Deutschland. Anime2You nennt samstags um 19 Uhr. Am 09.10. prüfen wir selbst."
      - art: grund
        text: "Unser Lauf erkannte Anime2Yous Disney+-Sammelartikel nicht als Start. Deshalb fehlte die Folge bei uns bis zum 04.10."
      - art: abhilfe
        text: "Der Lauf erkennt solche Artikel jetzt. Meldungen ohne Titelzuordnung landen in einer Liste, statt zu verschwinden."
      - art: zusage
        text: "Stellt sich ein Termin als falsch heraus, berichtigen wir ihn mit einer neuen Meldung und unserem Beleg."
  schedule:
    firstEpisodeDate: "2026-10-02"
    time: "19:00"
    observed:
      1: "2026-10-02"
    # Sommerzeit endet am 25.10.2026: Der Takt bleibt bei Samstag 02:00 JST, in Berlin wird daraus 18:00 (Folge 5 am 30.10. an).
    zeiten:
