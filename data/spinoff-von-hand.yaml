# Spin-offs, Parodien, Nebenserien und Nachfolgeserien mit eigenem Titel, die in einer Reihe stehen, aber keine Staffel der Hauptzählung sind.
#
# Das Panel nummeriert alle Fernsehserien einer Reihe als „Staffel 1, 2, 3". Ein Spin-off bekam dabei die Nummer einer Hauptstaffel
# (zwei Kacheln „Staffel 3" in einer Reihe). Wer hier steht, trägt `FranchiseMember.eigenesWerk`: `hauptstaffeln()` zählt ihn nicht,
# das Panel zeigt ihn unter „Eigene Serien" ohne Staffelnummer. Gleiche Wirkung wie `cartoon-eigene-serien.yaml` (dort Cartoons).
#
# Gemessen am 03.11.2026 (public/data/franchises.json plus AniList-Cache): Aufnahme, wenn AniList den Titel als SPIN_OFF eines früheren
# Reihenteils führt (oder PARENT auf einen früheren Reihenteil) und der Titel als Hauptstaffel (TV/ONA) gezählt wurde; dazu von Hand
# Fortsetzungen eines Spin-offs und Titel, die eine doppelte Staffelnummer auslösten. Kennungen über 10000000 sind aniSearch-Kennungen
# (10000000 + aniSearch-Nummer) und werden mit der aniSearch-Seite belegt. Ein neuer Fall: Eintrag ergänzen, `pipeline/lib/remake-zaehlung-bekannt.ts` kürzen.
#
# Jeder Eintrag: ids, grund und quelle (https-Adresse, die es belegt).

