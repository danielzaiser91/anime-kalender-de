# Teile einer Reihe, die AniList nicht miteinander verbindet.
#
# Die Reihenbildung folgt AniLists Beziehungen (siehe FRANCHISE_RELATIONS in shared/mappings.ts).
# Fehlt dort eine Kante, zerfällt eine Reihe in zwei, und im Panel fehlen Teile. Jeder Eintrag
# hier verbindet die genannten Titel zu einer Reihe — nur mit Grund, und nur, wo die Lücke bei
# AniList liegt und nicht bei uns.

# Danganronpa 3 lief 2016 in zwei parallelen Hälften, Future Arc und Despair Arc, dazu das
# Finale Hope Arc. AniList verbindet Despair Arc mit dem ersten Danganronpa (PREQUEL) und Future
# Arc mit Hope Arc (SEQUEL), aber nicht die beiden Hälften miteinander (abgefragt 21.09.2026).
# Die Reihe zerfiel dadurch in zwei; Daniel: „hat dieser anime keine 2. staffel?"
- ids: [21509, 21825]
  grund: 'Danganronpa 3: Future Arc und Despair Arc sind die zwei Hälften derselben Staffel'

# Black Jack: Capital Transfer To Heian (Heian Sento, 1996) hat bei AniList keine einzige Anime-Beziehung,
# nur dieselbe Manga-Vorlage (31600) wie neun Titel der Reihe (abgefragt 05.10.2026).
- ids: [1520, 10055]
  grund: 'Black Jack: Capital Transfer To Heian ist Teil der Black-Jack-Reihe; AniList verbindet ihn mit keinem Anime'

# --- Prüfliste der aniSearch-Reihen (11.10.2026) ----------------------------------------------------
