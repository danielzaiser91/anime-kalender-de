# --- Handkennungen für die reinen aniSearch-Reihen, Hauptbestand (12.10.2026, Bericht reihen-abstand-2026-10-12) ---
# Teile einer heutigen Reihe, die aniSearch nicht (A), nur als „?“ (B), nur als Sammelart Anderes/Charakter/Crossover (C)
# oder nur als „Gemeinsames Universum“ (D) an die Hauptreihe bindet. Je Eintrag steht ein Titel je Teil (bei Teilen im Hauptbestand
# und bei von aniSearch eingetragenen Titeln alle, bis acht), damit der reine Weg (REIHEN_QUELLE=anisearch) die Reihe bildet wie heute.
# Beleg je Eintrag im Grund: AniList-Beziehung im Katalog (`rel` in data/cache/anilist-katalog.json) oder gleicher Namensanfang, dazu
# die Beziehungsart in den Archivseiten (data/anisearch-raw). Draußen blieben Crossover und eigene Werke im selben Universum (Higurashi/Umineko,
# Riding Bean/Gunsmith Cats, Megalo Box/Ashita no Joe, Grendizer/Mazinger Z, Nisekoimonogatari …) und Fälle ohne Beleg; sie stehen im PR.
# `reinIds:` verbindet wie `ids:`, gilt aber nur im reinen Weg: `03-reihen.ts` liest den Schlüssel nicht, denn dort stehen die Teile schon in einer Reihe
# (geprüft gegen public/data: alle ids eines Eintrags tragen dieselbe franchiseId). So bleibt die Ausgabe des Standardwegs unverändert.
# `pipeline/check-reinids-grund.ts` (check:logic) rechnet nach: wo der Grund „AniList-Beziehung" sagt, liegen alle Teile in einer `rel`-Komponente des Katalogs; Teile ohne Eintrag oder ohne Beziehung stehen unter „(außer …)".

