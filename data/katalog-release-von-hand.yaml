# Ein Release, dessen Folgen alle an seinem Starttag liegen, ist ein Katalog-Release; „Alle N Folgen auf einmal“ steht aber nur
# mit ausdrücklichem Beleg da. Ohne Eintrag hier zeigt die Kachel „Vermutlich alle N Folgen auf einmal“.
#   art: komplett    die Quelle schreibt „Episoden: N (komplett)“ zum Starttag (Zitat wörtlich, unter 15 Wörtern)
#   art: beobachtet  alle Folgen waren am selben Tag im Abruf zu sehen, nicht nur als Katalog-Stempel
#   art: teil        nur ein Teil der Staffel („12 von 24“) — kein Katalog-Release
# Die Zitate stammen aus den Artikeln (gelesen am 13.10.2026); in data/proposals/aussagen.json stehen sie nur zum Teil
