# Offizielle Websites, deren News-Liste der Sammler liest (pipeline/fetch-offizielle-news.ts). Handliste: der Sammler liest sie nur.
# Saat: Messlauf vom 13.10.2026 (daniel-zum-abarbeiten/berichte/offizielle-seiten-messlauf-2026-10-12.md), die 60 Hosts mit sicher lesbarem Muster:
#   feed = RSS/Atom, wp = WordPress-REST, json = JSON-Liste, html = HTML-Liste mit Datum (ein Leser für alle, pipeline/lib/offiziell-html.ts).
# host    Hostname wie im Link der Seite (aniSearch-Website des Titels); daraus folgt der Titel (pipeline/lib/offiziell-seiten.ts).
# url     Adresse der News-Liste, aus der Startseite des Hosts gelesen, nie geraten.
# sprache Sprache der Überschriften (ja, en).
# pause   Crawl-delay der robots.txt in Sekunden, wo einer genannt ist (der Sammler liest die robots.txt zusätzlich selbst).
# Neuer Host: erst die robots.txt und die Startseite lesen (Feed-Link, News-Link), Muster am echten Abruf prüfen, dann eintragen.
# Nicht aufgenommen: Seiten mit Bot-Sperre (403), JS-Listen ohne ermittelten Datenpfad, „HTML wenig“, Weiterleitungen auf andere Hosts (gundam.info, niwatori-fighter.net).
