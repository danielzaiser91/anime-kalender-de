# Angekündigte Simulcasts: wann ein Titel startet und ob eine deutsche Synchro angekündigt ist.
#
# **Wofür das gut ist** (Daniel, 25.09.2026, an Magic Knight Rayearth 2026): Das Detail-Panel
# sagte „Noch keine deutsche Fassung" — und verschwieg, dass Crunchyroll den Titel ab dem 07.10.
# zeigt und eine deutsche Synchro schon angekündigt hat. „es ist wichtig wichtigste infos auf
# einen blick zu vermitteln … wir dienen den nutzern als informationsquelle."
#
# **Liegt bewusst nicht in `data/curated/`:** Der Bau liest dort jede Datei als Termine
# (`pipeline/lib/curated.ts`).
#
# **Was hier steht, ist kein Termin.** Ein Eintrag erzeugt keinen Kalendertermin und keinen
# Synchro-Beleg; er erscheint nur im Antwortkasten des Panels. Der OmU-Start ist nicht der
# deutsche Start — Crunchyroll nennt die Synchro-Termine erst später („DE: TBA").
#
# Felder:
#   anilistId   unser Titel
#   titel       nur zur Lesbarkeit
#   platform    Anbieter des Simulcasts
#   omuAb       Start mit Untertiteln: „JJJJ-MM-TT", oder „JJJJ-MM", wo nur der Monat genannt ist
#   synchro     angekuendigt (die Quelle nennt eine deutsche Fassung) | offen (sie nennt keine)
#   quellen     wo es steht
#   stand       Datum der Quelle
#
# **Zuordnung belegt über Name und Starttermin**, nicht über den Namen allein: Jeder Titel
# unten trägt bei uns denselben Japan-Start wie im Artikel (±1 Tag, JP gegen Simulcast), außer
# Black Clover S2 und Apothekerin S3, bei uns ohne Tag, dort gilt der exakte Staffelname.
# Ausgelassen, weil der Termin nicht passt oder fehlt: „Dreamland" (114466, ohne Start),
# „Paw & Palaces" (166443, Start 03.12.2025), die ältere Ace-of-the-Diamond-Staffel (177634).
#
# **Handpflege ist die Übergangslösung.** Die automatische Quelle ist Crunchyrolls
# Season-Lineup-Artikel (je Titel „OmU: <Datum>" und „DE: TBA"); sein Abruf steht in status.md.

# Kurzformen für `quellen`, damit nicht jede Zeile dieselben Adressen trägt.
quellen:
  lineup: https://www.crunchyroll.com/de/news/seasonal-lineup/2026/9/15/crunchyroll-anime-lineup-herbst-2026
  synchros: https://www.crunchyroll.com/de/news/seasonal-lineup/2026/9/15/crunchyroll-deutsche-synchros-herbst-2026

