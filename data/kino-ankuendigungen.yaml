# Kinostart-Ankündigungen für Anime-Filme ohne deutsche Fassung.
#
# Hier steht nur, was über AniLists `jpStart` hinausgeht: ein genauerer oder
# berichtigter japanischer Kinostart (`jp`), ein angekündigter deutscher
# Zeitraum ohne genauen Tag (`deZeitraum`), der deutsche Verleih (`verleih`)
# und die Fassung, sofern angekündigt (`fassung`: synchro | omu | beides).
#
# Ein genauer deutscher Kinostart gehört NICHT hierher, sondern als Release
# nach data/curated/kino-2026.yaml — nur dort erscheint er im Kalender.
#
# Datumsangaben immer in Anführungszeichen ("2026-12-11", "2026-12", "2027"):
# js-yaml macht aus einem nackten Datum sonst ein Date-Objekt.
#
# Angelegt am 13.09.2026 (Daniel: „ersetz es entsprechend für alle filme die als
# kino film angekündigt sind … guck dafür für jeden film in unseren bestand und
# mach auch eine web recherche").


