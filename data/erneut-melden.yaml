# (`tools/verdacht.mjs`).
#
# **Nicht von Hand eintragen**, sondern: node tools/erneut-melden.mjs <anilistId>[:anbieter] … --grund "…"
# Das Skript schreibt die Zeile, erzeugt Prüflisten und Prüfstand (Status-App) neu, prüft und
