# Von Hand geprüfte Angaben zu den Anbieter-Verweisen.
#
# Warum es diese Datei gibt: Ein Stream-Verweis sagt, **dass** ein Titel dort
# läuft — nicht, in welcher Sprache. Die Pipeline kann das nur dort belegen, wo
# eine Quelle es selbst nennt: ADN führt je Folge den Sprachcode `vde`,
# Crunchyroll schreibt „(Deutsch)" in den Kalender. Für alles andere —
# YouTube-Kanäle, Netflix, Prime Video, RTL+, Joyn — gibt es keine
# maschinenlesbare Auskunft. Übrig bleiben rund 3.000 Verweise mit „🇩🇪 ?".
#
# Diese Datei ist der Ort, an dem daraus eine Antwort wird. Gepflegt wird sie
# ausschließlich durch tatsächliche Prüfung — Daniel öffnet den Verweis und
# sieht nach. Geraten wird hier nichts.
#
# Drei mögliche Ergebnisse, und der Unterschied zwischen den letzten beiden ist
# wichtig:
#
#   dub: true         Deutsche Synchro dort vorhanden.
#   dub: false        Dort **nur** Originalton mit Untertiteln. Der Verweis wird
#                     **entfernt** — diese Seite beantwortet eine Frage, und
#                     zwar wo ein Anime auf Deutsch zu sehen ist (Daniel,
#                     15.08.2026: „wir interessieren uns als app nur für
#                     deutsche synchros"). Hier stand bis zum 20.08.2026, der
#                     Verweis bleibe mit einem „🇩🇪 ✕" stehen; das war seit
#                     jener Ansage überholt.
#
#                     Der Unterschied zu `available: false` bleibt trotzdem
#                     wichtig, denn er hält fest, **warum** nichts dasteht: hier
#                     „gibt es, aber nicht auf Deutsch", dort „gibt es nicht".
#   available: false  Der Titel ist dort gar nicht (mehr) zu haben: „Videos
#                     nicht verfügbar", oder der Verweis leitet auf die
#                     Startseite. Der Verweis wird **entfernt**. Ein „✕" wäre
#                     hier falsch, denn es behauptete ein Angebot ohne Synchro,
#                     wo es überhaupt kein Angebot gibt (Daniel, 12.08.2026).
#
# Felder:
#   anilistId  Pflicht — die Kennung des Anime.
#   platform   Pflicht — crunchyroll | netflix | primevideo | youtube | adn |
#              aniverse | wow | joyn | rtlplus | disneyplus
#   dub        true/false, oder `available: false` statt dessen.
#   checkedAt  Pflicht — Datum der Prüfung, ISO, in Anführungszeichen.
#   note       Optional — was genau gesehen wurde.

