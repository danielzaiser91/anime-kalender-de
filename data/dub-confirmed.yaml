# YouTube nennt die Tonspur selbst — man muss sie nur lesen.
#
# Daniel am 23.08.2026, mit Bild: „da steht doch eindeutig audio deutsch, also
# musst du es auch automatisch bekommen können." Er hatte recht. Die Angabe
# steht dreifach in der JSON-Fracht der Seite, aus der sich YouTube selbst
# bedient — `metadataRowRenderer` mit „Audio", `metadataLineRenderer` mit
# „Audio: Deutsch", und ein `factoidRenderer` mit der Hauptsprache.
#
# Ein Abruf je Video, kein Rendern, kein Schlüssel; `robots.txt` sperrt
# `/watch` nicht. Von 87 Verweisen nennen 41 ihre Tonspur — vorher waren
# sechs über den Videotitel erkennbar.
#
# Die Angabe gibt es nur, wo YouTube sie kennt: bei Filmen und Serien aus dem
# eigenen Angebot. Ein hochgeladenes Video hat sie nicht, und dort steht dann
# nichts — das heißt „unbekannt", nicht „kein Deutsch".

