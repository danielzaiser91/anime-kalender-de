# RTL+ ist ein rein deutschsprachiger Dienst — Daniels Entscheidung vom 23.08.2026:
# „rtl+ einträge kannst du immer davon ausgehen das sie deutsch sind, wenn sie
# dort eingetragen sind, es ist ein rein deutschsprachiger online streaming dienst."
#
# Das ist eine Festlegung, keine Messung, und sie steht hier ausdrücklich als
# solche. RTL+ nennt die Tonspur nirgends strukturiert: Der `TVSeries`-Block
# nach schema.org führt Name, Beschreibung, Adresse und Bild, sonst nichts. Das
# `inLanguage: "de"` daneben gehört zur `WebPage` und stünde auch über einem
