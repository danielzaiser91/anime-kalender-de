# (20927) ist bei aniSearch der Sequel der Neuverfilmung.
- remake: 177476
  original: 2335
  grund: 'Yaiba: Samurai Legend (2025) erzählt Kenyuu Densetsu Yaiba (1993) neu; die Fortsetzung 2027 baut auf der Neuverfilmung auf'
