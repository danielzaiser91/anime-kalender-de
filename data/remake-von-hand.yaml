# Neuverfilmungen, die aniSearch nicht als „Remake" führt — das Original bleibt in der Reihe, die Neuverfilmung
# und ihre Fortsetzungen zählen als eigene Linie (`FranchiseMember.remakeVon`, `zaehlgruppen()` in shared/titles.ts).
#
# Die aniSearch-Beziehung „Remake" (beidseitig eingetragen, die spätere Serie ist die Neuverfilmung) wird im Bau
# automatisch gelesen (`pipeline/bau/remake-von.ts`); hierher gehört nur, was dort anders oder gar nicht steht.
# Jeder Eintrag: remake und original (AniList-Kennungen der Titel), grund und quelle (https-Adresse, die es belegt).
# Beide müssen Serien (TV/ONA) derselben Reihe sein, sonst warnt der Bau.

