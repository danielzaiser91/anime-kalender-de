- id: 132232 # Re:cycle of the Penguindrum (2022, Film in zwei Teilen)
  umfang: reihe
  lizenz: CC BY-SA 4.0
  text: >-
    Zweiteiliger Film zur Serie „Penguindrum“ (Regie Kunihiko Ikuhara, Brain's Base), in Japan von April bis Juli 2022. Die Geschwister Kanba, Shouma und Himari Takakura leben ohne Eltern, und Himari ist schwer krank. Bei einem Ausflug bricht sie zusammen und stirbt; wenig später steht sie wieder auf, mit einem seltsamen Hut auf dem Kopf. Ein Wesen in der Pinguinmütze hat sie gerettet, verlangt dafür aber, dass die Brüder mit Hilfe dreier Pinguine den Penguindrum suchen.
