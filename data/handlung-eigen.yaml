- id: 141352 # The Seven Deadly Sins: Grudge of Edinburgh Part 1 (2022, Netz-Film, ~52 min; Quellen beschreiben beide Teile zusammen)
  umfang: reihe
  lizenz: CC BY-SA 4.0
  text: >-
    Erster von zwei Teilen eines Netz-Films (2022, rund 52 Minuten) zur Reihe „The Seven Deadly Sins“; beide Teile erzählen eine zusammenhängende Geschichte. Sie setzt nach der Hauptserie ein, die Gruppe der Sieben Todsünden besteht nicht mehr. Tristan hat den Dämon Meliodas zum Vater und die Göttin Elizabeth zur Mutter und trägt die Kräfte beider Seiten in sich. Weil er sie nicht beherrscht, geht er Kämpfen aus dem Weg, so sehr sein Vater auch auf mehr Training drängt. Lancelot, der Sohn von Ban und zur Hälfte Fee, war Tristans Freund; als Kind hat Tristan ihn bei einem Übungskampf schwer verletzt, seither ist Lancelot verschwunden. Dann erkrankt Elizabeth an einem Fluch. Tristan will herausfinden, wer dahintersteckt, und den Fluch brechen. Verantwortlich ist Priest, der Gehilfe von Deathpierce, einem ehemaligen Ritter von Liones, der sich für erlittenes Unrecht rächen will: Er strebt ein Land allein für Menschen an, lässt Feen, Riesen und Dämonen fangen und verschmilzt sie mit einem magischen Stab zu Monstern; seine Truppen sind magische Automaten in Rüstungen. Gowther heftet Tristan einen Peilsender an und holt Ban, Diane und King zu Hilfe. Unterwegs begegnet Tristan einer Fee, die drei nichtmenschliche Kinder vor der Rüstungsarmee in Sicherheit gebracht hat.
