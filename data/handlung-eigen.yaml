    Sonderfolge zur Fantasyserie um den Schleim Rimuru, in Japan seit März 2024; im Mittelpunkt steht Diablo, in der Serie Rimurus treuer Diener. Der Büroangestellte Satoru Mikami wird bei einem Überfall erstochen und kommt als Schleim in einer fremden Welt wieder zu sich. Eine Stimme berät ihn und verleiht ihm Fähigkeiten, darunter die Fähigkeit, andere Wesen zu verschlingen und ihre Gestalt und Fertigkeiten anzunehmen. Er stößt auf den eingesperrten Sturmdrachen Veldora und steigt später zum Dämonenkönig Rimuru Tempest auf.
