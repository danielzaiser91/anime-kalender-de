# Eigene deutsche Handlungstexte (Daniel, 12.10.2026: Option C). Nur für Titel, zu denen weder eine Quelle noch das aniSearch-Archiv eine deutsche Handlung liefert;
# sobald eine Quelle einen Text führt, wird der Eintrag nicht mehr genutzt und gehört gelöscht (Hinweis im Bau und in check:logic).
#
# Je Eintrag: id (Titel-Kennung, Kommentar: Titel, Jahr, Umfang), text (aus Fakten selbst geschrieben, nie aus einer Quelle abgeschrieben; Abstand gemessen: kein gemeinsamer 5-Wort-Abschnitt),
# umfang (titel = beschreibt den Titel selbst, reihe = beschreibt nur die Reihe), lizenz (Lizenz dieses Textes; bei Wikipedia-Quelle CC BY-SA 4.0), quellen (name, url; mindestens eine).
# Quellenregel (13.10.2026, geprüft in pipeline/lib/handlung-eigen.ts): Quellen aus mindestens zwei Familien (alle Wikipedia-Sprachen = eine, aniSearch = eine); sonst nur mit `freigabe: "Daniel, TT.MM.JJJJ: …"`. Nur aniSearch mit CC-Lizenz ist nie erlaubt.
