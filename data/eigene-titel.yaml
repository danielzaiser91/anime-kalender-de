# Eigene Titel: belegte Ankündigungen für Titel, die kein AniList-Eintrag trägt (Daniel, 04.11.2026:
# „ein fehlender AniList-Eintrag ist nie ein Grund, etwas nicht anzuzeigen“).
#
# Der Titel erscheint im Kalender, sobald hier eine Zeile steht. Der Termin kommt nicht von hier, sondern wie bei jedem Titel aus der
# Meldung (`releasesAus`): Der Titel muss dafür unter genau dem Namen stehen, den die Meldung nennt. Anbieter und Tag sagen, was die
# Quelle belegt; fehlt der Termin im Bau, steht das im Bestandsprüfer (`check-eigene-titel-bestand.ts`).
#
# Felder je Zeile:
#   nr         laufende Nummer, nie wiederverwendet (Kennung = 5.000.000 + nr)
#   name       Name so, wie die Meldung ihn nennt (deutsch)
#   format     TV | MOVIE | OVA | ONA | SPECIAL
#   anbieter   Plattformkennungen (`PLATFORMS`), die die Quelle für Deutsch nennt
#   tag        Starttag laut Quelle (JJJJ-MM-TT)
#   sources    Adressen der Quelle (https)
#   zitat      der belegende Satz, wörtlich
#   zuId       (optional) Kennung des Katalogtitels, in dem dieser Titel aufgeht: Termine ziehen um, die alte Adresse leitet weiter
#   widerrufen (optional) Quelle und Datum, wenn die Ankündigung zurückgenommen wurde: Titel und Termin entfallen, die Nummer bleibt vergeben
#   tmdb       `movie/<Kennung>` oder `tv/<Kennung>`: das TMDB-Werk, dessen Plakat der Titel trägt. Pflicht, außer `coverGrund` oder `zuId` steht da.
#              Die Kennung stammt aus der TMDB-Suche (Name, Jahr, Genre Animation), nie geraten; der Plakatlauf holt das Bild beim nächsten Durchlauf.
#   coverGrund statt `tmdb`: warum es kein Plakat gibt (ein Termin ohne Bild fiel am 03.11.2026 erst im Kalender auf)
#
# Führt ein Katalog den Titel später selbst, meldet der Bestandsprüfer „Katalog führt jetzt …“: dann `zuId` setzen, nicht löschen.

