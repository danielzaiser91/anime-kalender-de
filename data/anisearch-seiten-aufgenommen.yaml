# aniSearch-Seiten, die in einem AniList-Titel aufgehen: aniSearch-Seite → AniList-Kennung des Titels.
#
# Wozu: aniSearch führt manches als mehrere Seiten, was ein Anbieter und AniList als einen Titel führen. Die Seite bekommt dann keine eigene Zeile
# (`vergebeneSeiten` in `pipeline/bau/anisearch-titel.ts`), ihr Termin- und Belegstand steht am AniList-Titel. Die alte Adresse `/t/<alt>/` leitet
# über `zuAk` in `data/kennungen.json` auf den Titel. Nur eintragen, wenn der Titel das Werk vollständig führt (Folgenzahl) und die Seite nichts
# enthält, was er nicht schon trägt; eine fehlende Seite im Titel ersetzt dieser Eintrag nicht.

# Thus Spoke Kishibe Rohan (Netflix title/81280998: eine Miniserie, vier Folgen). AniList 21778 führt 4 Folgen, aniSearch teilt in drei Seiten:
# 11869 (Das Millionärsdorf, am Titel gebunden in anisearch-ids-hand.yaml), 13343 (Mutsu-kabe Hill, 1 Folge), 14752 (Bei der Beichte / Der Lauf, 2 Folgen).
13343: 21778
14752: 21778
