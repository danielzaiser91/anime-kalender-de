# Verweise, die kein Sammellauf findet — von Hand belegt.
#
# **Wofür das gut ist.** Die Erweiterung meldet Seiten, die unser Datensatz gar
# nicht kennt: Ein Anbieter führt denselben Anime unter mehreren Kennungen, und
# aniSearch nennt nur eine. Solche Meldungen landen in
# `daniel-zum-abarbeiten/11-meldungen-ohne-zuordnung.md` — und blieben dort
# liegen, denn es gab keinen Weg, die Adresse einzutragen. Am 10.09.2026 warteten
# so 54 Meldungen zu drei Haikyu!!-Staffeln.
#
# `data/adn-adressen.yaml` und `data/rtlplus-adressen.yaml` **ersetzen** eine
# vorhandene Adresse; diese Datei **legt eine an**. Das ist der Unterschied, und
# er ist der Grund, warum es eine dritte Datei braucht.
#
# **Was ein Eintrag nicht tut: urteilen.** Er sagt „dort gibt es diesen Titel",
# nicht „dort ist er auf Deutsch". Das Sprachurteil kommt weiter aus den
# Meldungen — sobald die Adresse hier steht, findet `fetch-pruefungen.ts` sie
# und ordnet die Folgenbefunde zu.
#
# **Jede Zeile trägt ihren Beleg.** Nicht „sieht richtig aus", sondern was
# gemessen wurde: die Staffelangabe der Seite, die Folgenzahl, die Summe. Ein
# Namensvergleich allein genügt nicht — „Beyblade Burst Surge" und „Beyblade
# Burst Rise" trennt ein Wort.
#
# Felder:
#   anilistId  Pflicht — die Kennung des Anime.
#   platform   Pflicht — crunchyroll | netflix | primevideo | youtube | adn |
#              aniverse | wow | joyn | rtlplus | disneyplus
#   url        Pflicht — die Adresse, wie sie im Browser steht.
#   belegtAm   Pflicht — Datum, ISO, in Anführungszeichen.
#   beleg      Pflicht — womit die Zuordnung gemessen wurde.

