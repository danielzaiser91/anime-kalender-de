<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Diese Seite darf nicht in den Index. Ohne die Zeile nimmt Google sie als
      gewoehnliche Seite auf und meldet sie anschliessend als Fehler zurueck.
    -->
    <meta name="robots" content="noindex" />
    <title>Seite nicht gefunden — Anime-Kalender DE</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0e17;
        color: #e2e8f0;
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 2rem;
      }
      @media (prefers-color-scheme: light) {
        body { background: #f6f7fb; color: #1e293b; }
      }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1.5rem; max-width: 34rem; }
      a {
        display: inline-block;
        background: #0ea5e9;
        color: #fff;
        text-decoration: none;
        padding: .7rem 1.2rem;
        border-radius: .5rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Diese Seite gibt es nicht mehr</h1>
      <p>
        Vielleicht war es der Link zu einem Termin, den wir inzwischen anders
        führen. Im Kalender findest du alle aktuellen Termine.
      </p>
      <a href="/">Zum Kalender</a>
    </main>
  </body>
</html>
