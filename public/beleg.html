<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beleg-Schlüssel</title>
<style>
  body{margin:0;background:#0e1118;color:#e8edf5;font:15px/1.5 system-ui,Segoe UI,sans-serif;padding:32px 16px}
  main{max-width:520px;margin:0 auto} h1{font-size:20px} p{color:#8a97ab}
  input{width:100%;box-sizing:border-box;background:#0b0e14;border:1px solid #243044;border-radius:8px;color:#e8edf5;padding:10px;font:inherit;margin:8px 0}
  button{background:#2a4a8a;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;margin-right:8px}
  button.leise{background:#243044} #stand{margin-top:14px;font-weight:700}
  a{color:#7aa7ff}
</style>
</head>
<body><main>
<h1>Beleg-Schlüssel</h1>
<p>Die Beleg-Bilder an den Quellen sind privat. Trage hier einmal den Lese-Schlüssel ein; er bleibt in diesem Browser (nicht in der Adresse, nicht auf dem Server der Seite). Danach zeigt jede Quelle mit Bild ein „▣ Beleg".</p>
<input id="schluessel" type="password" autocomplete="off" placeholder="Lese-Schlüssel (beginnt mit bl_)">
<button id="speichern">Speichern</button><button id="loeschen" class="leise">Entfernen</button>
<div id="stand"></div>
<p><a href="./">Zur Seite</a></p>
<script>
  const K = 'belegLesetoken', stand = document.getElementById('stand'), feld = document.getElementById('schluessel')
  const zeige = () => { let v; try { v = localStorage.getItem(K) } catch {} stand.textContent = v ? 'Schlüssel gespeichert — die Beleg-Knöpfe sind sichtbar.' : 'Kein Schlüssel gespeichert.' }
  document.getElementById('speichern').onclick = () => { const v = feld.value.trim(); if (!/^bl_[0-9a-f]{48}$/.test(v)) { stand.textContent = 'Das sieht nicht wie ein Lese-Schlüssel aus (bl_ plus 48 Zeichen).'; return } try { localStorage.setItem(K, v) } catch { stand.textContent = 'Der Browser erlaubt kein Speichern.'; return } feld.value = ''; zeige() }
  document.getElementById('loeschen').onclick = () => { try { localStorage.removeItem(K) } catch {} zeige() }
  zeige()
</script>
</main></body></html>
